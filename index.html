<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mousse en herbe — A'Why</title>
<meta name="description" content="Les fondamentaux de la voile avant d'embarquer sur A'Why — association AWA.">
<meta name="theme-color" content="#E7EDE8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mousse en herbe">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --papier:#E7EDE8; --encre:#12262E; --encre-pale:#5C7480;
  --magenta:#B81C6B; --babord:#B5322B; --tribord:#1B7A4B;
  --trait:rgba(18,38,46,.2);
  --serif:"Fraunces",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--papier);color:var(--encre);font-family:var(--sans);
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--trait) .5px,transparent .5px),linear-gradient(90deg,var(--trait) .5px,transparent .5px);
  background-size:64px 64px;}
.wrap{max-width:700px;margin:0 auto;padding:0 18px}

header{position:sticky;top:0;z-index:30;background:rgba(231,237,232,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--encre)}
.bandeau{max-width:700px;margin:0 auto;padding:9px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.marque{font-family:var(--serif);font-weight:600;font-size:17px}
.marque em{font-style:italic;font-weight:400;color:var(--encre-pale)}
select{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
 background:var(--papier);color:var(--encre);border:1px solid var(--encre);padding:6px 8px;cursor:pointer}
.jauges{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:12px;color:var(--encre-pale)}
.jauges b{color:var(--encre);font-weight:500}
.btn-carnet{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--encre);padding:6px 10px;cursor:pointer}
.btn-carnet:hover{background:var(--encre);color:var(--papier)}

.deck{position:relative;min-height:66vh;padding:26px 0 10px;perspective:1400px}
.page{display:none}
.page.actif{display:block;animation:tourne .42s cubic-bezier(.2,.7,.3,1) both;transform-origin:left center}
@keyframes tourne{from{opacity:0;transform:translateX(26px) rotateY(-9deg)}to{opacity:1;transform:none}}
.page.retour.actif{animation:tourne-r .42s cubic-bezier(.2,.7,.3,1) both;transform-origin:right center}
@keyframes tourne-r{from{opacity:0;transform:translateX(-26px) rotateY(9deg)}to{opacity:1;transform:none}}

.folio{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--magenta);margin-bottom:14px;display:flex;gap:10px;align-items:center}
.folio::after{content:"";flex:1;height:1px;background:var(--trait)}
h1{font-family:var(--serif);font-size:clamp(29px,7vw,44px);line-height:1.05;font-weight:600;margin:0 0 14px;letter-spacing:-.02em}
h1 .sous{display:block;font-size:.44em;font-weight:400;font-style:italic;color:var(--encre-pale);margin-top:12px;letter-spacing:0;line-height:1.4}
.page p{margin:0 0 17px;max-width:58ch}
.page p.dit{font-family:var(--serif);font-size:20px;font-style:italic}
.consequence{border:1px solid var(--trait);border-left:3px solid var(--magenta);background:rgba(255,255,255,.55);padding:13px 15px;margin:0 0 20px}
.consequence .tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta);display:block;margin-bottom:5px}
.regle{border:1px solid var(--encre);background:rgba(255,255,255,.6);padding:15px 17px;margin:0 0 20px}
.regle .tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta);display:block;margin-bottom:7px}
.regle p:last-child{margin-bottom:0}
.protocole{font-family:var(--mono);font-size:14px;line-height:2;margin:0 0 18px}
.protocole span{border:1px solid var(--encre);padding:4px 9px;display:inline-block;margin:0 4px 4px 0;background:rgba(255,255,255,.6)}
.protocole span.rep{border-color:var(--magenta);color:var(--magenta)}
.binome{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:0 0 18px;
 border:1px solid var(--encre);background:rgba(255,255,255,.6);padding:14px}
.binome b{font-family:var(--serif);font-size:21px;font-weight:600;display:block;margin-bottom:3px}
.binome span{font-size:14px;color:var(--encre-pale);line-height:1.4;display:block}
.binome .fleche{font-family:var(--mono);color:var(--magenta);font-size:20px}
.binome div:last-child{text-align:right}
.liste{border:1px solid var(--trait);background:rgba(255,255,255,.5);padding:4px 0;margin:0 0 20px}
.liste div{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:9px 15px;border-bottom:1px solid var(--trait);align-items:baseline}
.liste div:last-child{border-bottom:0}
.liste b{font-family:var(--mono);font-size:12px;color:var(--magenta);letter-spacing:.06em;white-space:nowrap}
.liste span{font-size:15px}

.mot{font:inherit;font-weight:600;color:var(--encre);cursor:pointer;border:0;background:none;padding:0;border-bottom:2px solid var(--magenta)}
.mot:hover{background:rgba(184,28,107,.12)}
.mot.vu{border-bottom-style:dotted}
.mot.bab{color:var(--babord)} .mot.tri{color:var(--tribord)}

.choix{display:flex;flex-direction:column;gap:9px;margin:26px 0 6px}
.choix button{text-align:left;font:inherit;cursor:pointer;background:rgba(255,255,255,.62);border:1px solid var(--encre);padding:12px 14px 12px 42px;position:relative;transition:transform .12s,background .12s}
.choix button::before{content:attr(data-lettre);position:absolute;left:0;top:0;bottom:0;width:30px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--papier);background:var(--encre)}
.choix button:hover:not(:disabled){background:#fff;transform:translateX(3px)}
.choix button:disabled{opacity:.4;cursor:default}
.choix button:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.choisi{border-color:var(--magenta)!important;opacity:1!important}
.choisi::before{background:var(--magenta)}
.act{font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--encre);color:var(--papier);border:0;padding:12px 18px;cursor:pointer}
.act:hover{background:var(--magenta)}

.nav{position:sticky;bottom:0;background:rgba(231,237,232,.95);backdrop-filter:blur(6px);border-top:1px solid var(--encre);margin-top:24px}
.nav-in{max-width:700px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.nav button{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--encre);color:var(--papier);border:0;padding:11px 16px;cursor:pointer}
.nav button:disabled{opacity:.25;cursor:default}
.nav button:hover:not(:disabled){background:var(--magenta)}
.nav .compte{font-family:var(--mono);font-size:12px;color:var(--encre-pale);margin:0 auto}

/* ---------- atelier ---------- */
.indice{border:1px solid var(--encre);background:rgba(255,255,255,.62);padding:16px 18px;margin:0 0 16px}
.indice .groupe{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta);display:block;margin-bottom:8px}
.indice p{margin:0;font-size:17px;max-width:52ch}
.props{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.props button{text-align:left;font:inherit;cursor:pointer;background:rgba(255,255,255,.62);border:1px solid var(--encre);padding:11px 14px;transition:background .12s}
.props button:hover:not(:disabled){background:#fff}
.props button:disabled{cursor:default}
.props button.juste{background:rgba(27,122,75,.18);border-color:var(--tribord)}
.props button.faux{background:rgba(181,50,43,.16);border-color:var(--babord);opacity:.75}
.jauge-atelier{font-family:var(--mono);font-size:12px;color:var(--encre-pale)}

/* ---------- carnet ---------- */
.carnet-vue{position:fixed;inset:0;z-index:45;background:var(--papier);display:none;overflow:auto;padding:16px 18px 40px}
.carnet-vue.on{display:block}
.carnet-in{max-width:660px;margin:0 auto}
.carnet-tete{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--encre);padding-bottom:8px;margin-bottom:14px}
.carnet-tete h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0}
.carnet-tete .note{font-family:var(--mono);font-size:11px;color:var(--encre-pale);margin-left:auto}
.carnet-groupe{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta);margin:20px 0 6px}
.carnet-item{border-bottom:1px solid var(--trait);padding:9px 0;cursor:pointer}
.carnet-item b{font-family:var(--serif);font-size:18px;font-weight:600}
.carnet-item.pas-vu{opacity:.38}
.carnet-item.pas-vu b{font-style:italic}
.carnet-item em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--encre-pale);margin-left:8px}

.voile-fond{position:fixed;inset:0;background:rgba(18,38,46,.45);z-index:50;display:none}
.voile-fond.on{display:block}
.fiche{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:80vh;overflow:auto;background:var(--papier);border-top:2px solid var(--magenta);padding:22px 22px 28px;transform:translateY(101%);transition:transform .3s}
.fiche.on{transform:none}
@media(min-width:800px){.fiche{left:auto;top:0;bottom:0;width:380px;max-height:none;border-top:0;border-left:2px solid var(--magenta);transform:translateX(101%)}}
.fiche h3{font-family:var(--serif);font-size:27px;margin:5px 0 2px;font-weight:600}
.fiche .prononce{font-family:var(--mono);font-size:11px;color:var(--magenta);letter-spacing:.12em;text-transform:uppercase}
.fiche p{max-width:44ch}
.fiche .astuce{background:rgba(255,255,255,.6);border:1px solid var(--trait);padding:12px 14px;font-size:15px}
.fermer{position:absolute;top:14px;right:16px;background:none;border:1px solid var(--encre);font-family:var(--mono);font-size:11px;padding:5px 9px;cursor:pointer}

.qcm{margin:0 0 20px}
.qcm p{font-weight:600;margin:0 0 9px}
.qcm label{display:block;border:1px solid var(--trait);padding:9px 12px;margin-bottom:5px;cursor:pointer;background:rgba(255,255,255,.6)}
.qcm label:hover{border-color:var(--encre)}
.qcm input{margin-right:8px;accent-color:var(--magenta)}
.badge{text-align:center;padding:16px 6px}
.sceau{width:134px;height:134px;margin:0 auto 16px;border-radius:50%;border:2px solid var(--magenta);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px;font-weight:600;color:var(--magenta);text-align:center;padding:12px;background:repeating-conic-gradient(from 0deg,rgba(184,28,107,.07) 0 6deg,transparent 6deg 12deg);animation:sceau .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes sceau{from{transform:scale(.4) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header><div class="bandeau">
  <span class="marque">Mousse en herbe <em>— A'Why</em></span>
  <select id="menu-chap" aria-label="Choisir le chapitre">
    <option value="1">Chapitre 1 — Monter à bord</option>
    <option value="2">Chapitre 2 — Voiles et bouts</option>
    <option value="3">Chapitre 3 — Les actions</option>
    <option value="4">Chapitre 4 — Allures et manœuvres</option>
    <option value="5">Chapitre 5 — Le retour au port</option>
  </select>
  <span class="jauges"><span>Carnet <b id="j-mots">0</b>/<b id="j-total">0</b></span><span>Badges <b id="j-badges">0</b>/5</span></span>
  <button class="btn-carnet" id="btn-carnet">Carnet</button>
  <button class="btn-carnet" id="btn-installer" hidden>Installer</button>
</div></header>

<div class="wrap"><div class="deck" id="deck"></div></div>

<nav class="nav"><div class="nav-in">
  <button id="prec">← Page précédente</button>
  <span class="compte" id="compte"></span>
  <button id="suiv">Page suivante →</button>
</div></nav>

<div class="carnet-vue" id="carnet-vue"><div class="carnet-in">
  <div class="carnet-tete">
    <h2>Le carnet du mousse</h2><span class="note" id="carnet-note"></span>
    <button class="fermer" style="position:static;margin-left:10px" id="carnet-fermer">Fermer</button>
  </div>
  <div id="carnet-corps"></div>
</div></div>

<div class="voile-fond" id="voile-fond"></div>
<aside class="fiche" id="fiche" aria-live="polite">
  <button class="fermer" id="fermer">Fermer</button>
  <div class="prononce" id="f-cat"></div>
  <h3 id="f-titre"></h3><p id="f-def"></p>
  <div class="astuce" id="f-astuce"></div>
</aside>

<script>
/* =====================================================================
   GLOSSAIRE
   t : titre de fiche (avec article) · n : forme nue (dans le texte)
   c : catégorie (sert aussi de groupe d'atelier) · d : définition
   a : astuce · q : indice court utilisé par l'atelier
   ===================================================================== */
const G={
/* ======================= CHAPITRE 1 ======================= */
 ponton:{ch:1,t:"Le ponton",n:"ponton",c:"Le port",q:"Le trottoir flottant auquel le bateau est amarré, et qui bouge lui aussi.",d:"Le trottoir flottant auquel le bateau est amarré. Il bouge, lui aussi. On y marche, on n'y court pas — surtout avec un sac sur l'épaule.",a:"Règle du port : une main pour toi, une main pour ce que tu portes."},
 jupe:{ch:1,t:"La jupe",n:"jupe",c:"L'arrière",q:"La plage plate au ras de l'eau, tout à l'arrière : la porte d'entrée du bateau.",d:"La plage plate tout à l'arrière, au ras de l'eau. Sur A'Why le tableau arrière est ouvert : c'est la porte d'entrée du bateau. On embarque par là, rarement en escaladant les côtés.",a:"On dit aussi le tableau arrière pour la paroi qui ferme la coque à l'arrière."},
 filiere:{ch:1,t:"La filière",n:"filière",c:"La sécurité",q:"Le câble horizontal qui court le long du pont et t'empêche de tomber à l'eau.",d:"Le câble qui court le long du pont, de l'avant à l'arrière, et t'empêche de tomber à l'eau. Elle te retient à hauteur de cuisse — elle ne porte pas ton poids.",a:"Une filière se tient, se longe, s'enjambe. Jamais elle ne se piétine. Ce n'est pas une partie à considérer comme fixe et donc sécurisée."},
 chandelier:{ch:1,t:"Le chandelier",n:"chandelier",c:"La sécurité",q:"Le montant vertical qui tient le câble de sécurité, comme le piquet d'une clôture.",d:"Le montant métallique vertical qui tient la filière. Il y en a une rangée de chaque côté, comme les piquets d'une clôture.",a:"Chandelier = le piquet. Filière = le fil."},
 balcon:{ch:1,t:"Le balcon",n:"balcon",c:"La sécurité",q:"L'arceau tubulaire à l'avant et ses deux ailes à l'arrière : le seul point d'appui solide.",d:"L'arceau tubulaire qui ferme le pont à l'avant, et les deux ailes qui l'encadrent à l'arrière. C'est le seul endroit du bord où l'on peut s'accrocher.",a:"Sur A'Why, le balcon avant encadre la zone où se trouve l'ancre."},
 pataras:{ch:1,t:"Le pataras",n:"pataras",c:"La sécurité",q:"Le câble qui va du sommet du mât au tableau arrière et empêche le mât de basculer.",d:"Le câble qui relie le sommet du mât au tableau arrière et l'empêche de basculer vers l'avant. Il descend pile dans l'axe, au-dessus de la jupe : c'est la première chose que ta main trouve en embarquant.",a:"Il se règle, et c'est même le principal réglage du gréement. Lui, il ne bouge pas."},
 pont:{ch:1,t:"Le pont",n:"pont",c:"Le bateau",q:"La surface extérieure sur laquelle on marche, entre le roof et les filières.",d:"Toute la surface extérieure sur laquelle on marche, entre le roof et les filières. Il est bombé, souvent mouillé, parfois incliné à trente degrés.",a:"Chaussures fermées à semelle claire en nav. Les tongs pour le port."},
 roof:{ch:1,t:"Le roof",n:"roof",c:"Le bateau",q:"La partie surélevée au milieu du pont : le plafond de l'intérieur, avec ses hublots.",d:"La partie surélevée au milieu du pont : c'est le plafond de l'intérieur, avec ses hublots. Les cordages y sont renvoyés vers le cockpit.",a:"Prononcer « rouf ». Faux ami : rien à voir avec l'anglais."},
 descente:{ch:1,t:"La descente",n:"descente",c:"L'intérieur",q:"L'escalier presque vertical qui mène du cockpit à l'intérieur.",d:"L'escalier presque vertical qui mène du cockpit à l'intérieur, sous le capot coulissant à l'arrière du roof.",a:"En mer, on descend toujours avec précaution. Toujours."},
 carre:{ch:1,t:"Le carré",n:"carré",c:"L'intérieur",q:"La pièce à vivre en bas : table, banquettes, cartes étalées.",d:"La pièce à vivre en bas : table, banquettes, cartes étalées, café renversé. Le salon du bateau.",a:"Il s'appelle carré parce qu'il l'était, sur les navires d'autrefois. Il ne l'est plus."},
 cockpit:{ch:1,t:"Le cockpit",n:"cockpit",c:"L'arrière",q:"Le creux entouré de bancs où l'équipage se tient et manœuvre.",d:"Le creux à l'arrière où l'équipage se tient et manœuvre, entouré de ses bancs et contenant la barre ou la roue pour diriger le bateau. Poste de travail et salle à manger.",a:"Tout ce qui traîne dans le cockpit finit sous un pied. Rien ne traîne dans le cockpit."},
 barre:{ch:1,t:"La barre franche",n:"barre franche",c:"L'arrière",q:"Le long levier relié au safran, avec lequel on dirige le bateau.",d:"Le long levier relié à la tête du safran, la pelle immergée qui fait tourner le bateau. Sur A'Why, pas de roue : une barre franche.",a:"Elle marche à l'envers : barre poussée à droite, le bateau part à gauche."},
 winch:{ch:1,t:"Le winch",n:"winch",c:"Les outils",q:"Le diabolo métallique qui démultiplie ta force pour tendre un cordage.",d:"Le diabolo métallique qui démultiplie ta force pour tendre un cordage. Deux sur le roof pour les manœuvres du mât, deux au milieu du cockpit pour les écoutes avant, deux à l'arrière pour l'écoute de la GV.",a:"Attention, un winch mange les doigts : main à plat, jamais les doigts en crochet."},
 taquet:{ch:1,t:"Le taquet",n:"taquet",c:"Les outils",q:"La pièce métallique en T sur laquelle on bloque un cordage en huit.",d:"La pièce métallique en forme de T sur laquelle on bloque un cordage en huit. Il y en a à l'avant, au milieu et à l'arrière — c'est là qu'on attache le bateau au ponton.",a:"Un taquet se frappe en huit, jamais en nœud. Il faut pouvoir larguer en trois secondes."},
 amarre:{ch:1,t:"L'amarre",n:"amarre",c:"Le port",q:"Le cordage qui relie le bateau au ponton et le tient à sa place.",d:"Le cordage qui relie le bateau au ponton. Il y en a plusieurs, chacune avec son nom et son rôle : elles tiennent le bateau à sa place, pas seulement au quai.",a:"À bord, un cordage ne s'appelle jamais une corde. Chacun porte le nom de son métier."},
 babord:{ch:1,t:"Bâbord",n:"bâbord",c:"Les repères",q:"Le côté gauche du bateau quand on regarde vers l'avant. Feu rouge.",d:"Le côté gauche du bateau quand on regarde vers l'avant. Toujours. Même assis à l'envers, même la tête en bas.",a:"Dans l'alphabet, B vient avant T : bâbord avant tribord, comme la gauche avant la droite. Feu rouge. Bâbord, la gauche."},
 tribord:{ch:1,t:"Tribord",n:"tribord",c:"Les repères",q:"Le côté droit du bateau quand on regarde vers l'avant. Feu vert.",d:"Le côté droit du bateau quand on regarde vers l'avant. C'est un repère du bateau, pas de ton corps : il ne change jamais.",a:"Feu vert. Tribord, la droite."},

/* ======================= CHAPITRE 2 ======================= */
 pointdrisse:{ch:2,t:"Le point de drisse",n:"point de drisse",c:"Les trois points",q:"Le point du haut de la voile, celui par lequel on la fait monter.",d:"Le point du haut de la voile. C'est là qu'on frappe la drisse pour la hisser — et c'est la drisse qui lui donne son nom.",a:"En haut, la drisse. Le nom du point annonce déjà le nom du bout."},
 pointamure:{ch:2,t:"Le point d'amure",n:"point d'amure",c:"Les trois points",q:"Le point avant et bas de la voile, celui qui reste fixé au bateau.",d:"Le point avant et bas de la voile. Il reste fixé au bateau : au pied de mât pour la grand-voile, à l'étrave pour le foc.",a:"C'est le point qui ne bouge jamais. Les deux autres travaillent, lui tient."},
 pointecoute:{ch:2,t:"Le point d'écoute",n:"point d'écoute",c:"Les trois points",q:"Le point arrière et bas de la voile, celui qui passe d'un bord à l'autre quand on vire.",d:"Le point arrière et bas de la voile. C'est là qu'on frappe l'écoute, le bout qui règle son ouverture.",a:"C'est le point qui voyage : c'est lui qui passe d'un bord à l'autre quand on vire."},
 guindant:{ch:2,t:"Le guindant",n:"guindant",c:"Les trois bords",q:"Le bord avant de la voile, le long du mât ou de l'étai.",d:"Le bord avant de la voile, du point de drisse au point d'amure. Il court le long du mât pour la grand-voile, le long de l'étai pour le foc.",a:"C'est le bord qui faseye en premier quand on serre trop le vent."},
 bordure:{ch:2,t:"La bordure",n:"bordure",c:"Les trois bords",q:"Le bord du bas de la voile, le long de la bôme pour la grand-voile.",d:"Le bord du bas de la voile, du point d'amure au point d'écoute. Pour la grand-voile, elle court le long de la bôme.",a:"Bordure comme le bas d'une jupe. En bas, donc."},
 chute:{ch:2,t:"La chute",n:"chute",c:"Les trois bords",q:"Le bord arrière de la voile, le seul qui ne soit tenu par rien.",d:"Le bord arrière de la voile, du point de drisse au point d'écoute. C'est le bord libre : il n'est tenu par rien, et c'est lui qui donne la forme.",a:"Elle « tombe » du point de drisse vers l'arrière. D'où le nom."},
 drisse:{ch:2,t:"La drisse",n:"drisse",c:"Les deux bouts",q:"Le bout qui monte au sommet du mât et fait monter la voile.",d:"Le bout frappé au point de drisse, qui monte au sommet du mât et redescend. C'est lui qui hisse la voile.",a:"Drisse comme « dresser ». Une drisse monte, toujours."},
 ecoute:{ch:2,t:"L'écoute",n:"écoute",c:"Les deux bouts",q:"Le bout qui règle l'ouverture de la voile : le plus manipulé du bord.",d:"Le bout frappé au point d'écoute, qui règle l'ouverture de la voile. Le plus manipulé de tous les bouts du bord.",a:"Écoute et point d'écoute portent le même nom : c'est toute la logique du chapitre."},
 grandvoile:{ch:2,t:"La grand-voile",n:"grand-voile",c:"Les deux voiles",q:"La voile arrière, tenue par le mât devant et par la bôme en bas.",d:"La voile arrière, tenue par le mât sur son avant et par la bôme sur son bas. C'est la voile principale, celle qui reste en place le plus longtemps.",a:"On dit « la GV », sans « e » à grand : c'est un vieux féminin qui a survécu."},
 foc:{ch:2,t:"Le foc",n:"foc",c:"Les deux voiles",q:"La voile avant, hissée le long de l'étai et changée selon la force du vent.",d:"La voile avant, hissée le long de l'étai. A'Why est un bateau de régate : il embarque neuf voiles, et le foc du jour se choisit selon la force du vent. Pas d'enrouleur à bord — un foc se hisse, se creuse, et se change.",a:"Pas d'enrouleur veut dire : on monte à l'avant pour l'affaler et le changer. C'est le poste le plus mouillé du bateau."},
 bout:{ch:2,t:"Le bout",n:"bout",c:"Le gréement",q:"Le mot du bord pour un cordage. Prononcer « boute ».",d:"Le mot du bord pour un cordage. Prononcer « boute ». À bord il n'y a pas de corde : il y a des bouts, et chacun porte le nom du travail qu'il fait.",a:"Corde est un mot de terrien. Le seul cordage à s'appeler corde à bord, c'est celle de la cloche."},
 mat:{ch:2,t:"Le mât",n:"mât",c:"Le gréement",q:"Le grand tube vertical, tenu debout par ses câbles.",d:"Le grand tube d'aluminium vertical. Il tient les voiles en l'air et il est lui-même tenu par des câbles : l'étai devant, le pataras derrière, les haubans sur les côtés.",a:"Seul, un mât ne tient pas debout. Ce sont ses câbles qui le tiennent."},
 bome:{ch:2,t:"La bôme",n:"bôme",c:"Le gréement",q:"Le tube horizontal articulé au mât, qui tient le bas de la grand-voile.",d:"Le tube horizontal articulé au mât, qui tient la bordure de la grand-voile. Elle balaie le cockpit à hauteur de tête quand on change de bord.",a:"Le mot à retenir sur un bateau : « attention la bôme ». On s'accroupit d'abord, on regarde ensuite."},
 etai:{ch:2,t:"L'étai",n:"étai",c:"Le gréement",q:"Le câble tendu du haut du mât à l'étrave, sur lequel se hisse le foc.",d:"Le câble tendu du haut du mât jusqu'à l'étrave. Il retient le mât vers l'avant, et c'est sur lui que se hisse le foc.",a:"Étai devant, pataras derrière : les deux se répondent, et tendre l'un détend l'autre."},

/* ======================= CHAPITRE 3 ======================= */
 vent:{ch:3,t:"Le vent",n:"vent",c:"Les deux repères",q:"Le repère mobile du bord : la seule chose qui fasse avancer, et la seule qui ne se voie pas.",d:"La seule chose qui fasse avancer le bateau, et la seule qui ne se voie pas. On le lit sur la girouette en tête de mât, sur les penons des voiles, sur les rides de l'eau, sur sa propre nuque.",a:"Première question du bord, avant toutes les autres : d'où vient-il ?"},
 nord:{ch:3,t:"Le nord",n:"nord",c:"Les deux repères",q:"Le repère fixe du bord : il ne bouge jamais, mais il ne dit rien de ce que fait la voile.",d:"L'autre repère du bord, aussi indispensable que le vent — et son exact complément. Le nord ne bouge jamais : il sert à savoir où l'on va et à tracer une route sur la carte. Le vent bouge tout le temps : il sert à savoir ce que le bateau peut faire.",a:"Deux repères, deux usages. Le nord pour la route, le vent pour la voile. On ne remplace jamais l'un par l'autre."},
 litduvent:{ch:3,t:"Le lit du vent",n:"lit du vent",c:"Les deux repères",q:"L'axe d'où souffle le vent, et le secteur où le voilier ne peut pas avancer.",d:"L'axe d'où souffle le vent, et le secteur d'environ 45° de part et d'autre où un voilier ne peut pas avancer. Face au vent, les voiles battent et le bateau s'arrête.",a:"C'est le seul cap interdit. Tout le reste du tour d'horizon est navigable."},
 auvent:{ch:3,t:"Au vent",n:"au vent",c:"Les deux repères",q:"Le côté d'où vient le vent, celui qui se relève à la gîte.",d:"Du côté d'où vient le vent. Le bord au vent d'un bateau est celui qui se relève quand il gîte : c'est là que l'équipage s'assoit.",a:"Au vent = en amont. Le vent y passe avant d'atteindre le bateau."},
 souslevent:{ch:3,t:"Sous le vent",n:"sous le vent",c:"Les deux repères",q:"Le côté opposé au vent, celui qui plonge à la gîte.",d:"Du côté opposé à celui d'où vient le vent. C'est le côté qui plonge à la gîte, celui vers lequel les voiles se déportent.",a:"Sous le vent = en aval. Un objet tombé à l'eau y dérive."},
 hisser:{ch:3,t:"Hisser",n:"hisser",c:"Binôme 1 · la drisse",q:"Faire monter la voile en tirant sur sa drisse.",d:"Faire monter la voile en tirant sur sa drisse. Le mouvement est vertical, le long du mât ou de l'étai.",a:"On hisse près du lit du vent : une voile qui porte déjà ne monte plus."},
 affaler:{ch:3,t:"Affaler",n:"affaler",c:"Binôme 1 · la drisse",q:"Faire descendre la voile en libérant sa drisse, sans jamais la lâcher.",d:"Faire descendre la voile en libérant sa drisse. L'inverse exact de hisser.",a:"Affaler n'est pas lâcher : on accompagne, sinon la voile tombe à l'eau et le tissu passe sous la coque."},
 border:{ch:3,t:"Border",n:"border",c:"Binôme 2 · l'écoute",q:"Tirer sur l'écoute pour rapprocher la voile de l'axe du bateau.",d:"Tirer sur l'écoute pour rapprocher la voile de l'axe du bateau. La voile se referme, se tend, et travaille davantage.",a:"Border, c'est ramener vers soi. Le mot vient de « bord » : on ramène la voile vers le bord."},
 choquer:{ch:3,t:"Choquer",n:"choquer",c:"Binôme 2 · l'écoute",q:"Laisser filer l'écoute pour éloigner la voile de l'axe du bateau.",d:"Laisser filer l'écoute pour éloigner la voile de l'axe du bateau. La voile s'ouvre, se creuse, et finit par faseyer si on va trop loin.",a:"Choquer se fait toujours en gardant le bout en main. Une écoute qui part seule est une écoute perdue."},
 loffer:{ch:3,t:"Loffer",n:"loffer",c:"Binôme 3 · la barre",q:"Tourner pour rapprocher l'étrave du lit du vent.",d:"Faire tourner le bateau pour rapprocher son étrave du lit du vent. On se rapproche du vent, l'angle se referme.",a:"Loffer et border vont ensemble : quand le bateau se rapproche du vent, les voiles doivent se refermer aussi."},
 abattre:{ch:3,t:"Abattre",n:"abattre",c:"Binôme 3 · la barre",q:"Tourner pour éloigner l'étrave du lit du vent.",d:"Faire tourner le bateau pour éloigner son étrave du lit du vent. On s'écarte du vent, l'angle s'ouvre.",a:"Abattre et choquer vont ensemble. Abattre sans choquer, c'est coucher le bateau."},
 faseyer:{ch:3,t:"Faseyer",n:"faseyer",c:"Le signal",q:"Ce que fait une voile qui bat au vent au lieu de porter.",d:"Ce que fait une voile qui bat au vent au lieu de porter, parce qu'elle est trop choquée ou que le bateau serre trop le vent. Elle claque, elle ondule, elle ne tire plus.",a:"Le faseyement est un signal, pas une panne : la voile te dit qu'il faut border, ou abattre."},

/* ======================= CHAPITRE 4 ======================= */
 allure:{ch:4,t:"L'allure",n:"allure",c:"La notion",q:"L'angle entre l'axe du bateau et le lit du vent.",d:"L'angle entre l'axe du bateau et le lit du vent. Elle ne dépend ni du cap au compas, ni de la vitesse : uniquement de cet angle. Changer d'allure, c'est loffer ou abattre.",a:"L'allure ne se lit pas sur un instrument : elle se lit sur l'angle entre la girouette et l'étrave."},
 amures:{ch:4,t:"Les amures",n:"amures",c:"La notion",q:"Le bord d'où vient le vent : il donne son nom à la situation du bateau.",d:"Le côté d'où vient le vent donne son nom à la situation : vent venant de tribord, on est tribord amures ; vent venant de bâbord, bâbord amures. C'est la première chose qu'un équipier annonce en croisant un autre bateau.",a:"Tribord amures, la bôme est à bâbord. L'un dit toujours l'autre."},
 ventdebout:{ch:4,t:"Vent debout",n:"vent debout",c:"Les allures",q:"Face au vent : la seule allure impossible, où le bateau s'arrête.",d:"Étrave pile dans le lit du vent. Les voiles battent, le bateau ralentit puis recule. Ce n'est pas une allure, c'est l'absence d'allure — mais on y passe une seconde à chaque virement de bord.",a:"On dit aussi « dans les cailloux » ou « planté ». Rester vent debout n'arrive qu'aux distraits."},
 pres:{ch:4,t:"Le près",n:"près",c:"Les allures",q:"L'allure la plus serrée : environ 45° du vent, la plus gîtée et la plus mouillée.",d:"L'allure la plus proche du vent qu'un voilier puisse tenir, environ 45°. Voiles bordées à fond, bateau gîté, embruns. C'est l'allure où l'on remonte au vent, et la seule qui demande de tirer des bords.",a:"Serrer le près, c'est loffer jusqu'à la limite du faseyement, puis abattre d'un rien."},
 travers:{ch:4,t:"Le travers",n:"travers",c:"Les allures",q:"Vent perpendiculaire à l'axe du bateau : l'allure la plus rapide et la plus confortable.",d:"Vent à 90° de l'axe du bateau. Voiles à mi-ouverture. C'est souvent l'allure la plus rapide et la plus agréable : le bateau file droit sans excès de gîte.",a:"Au travers, si tu ne sais pas quoi faire, tu ne fais rien. C'est l'allure la plus stable du tour d'horizon."},
 largue:{ch:4,t:"Le largue",n:"largue",c:"Les allures",q:"Vent des trois-quarts arrière : voiles largement ouvertes, gîte faible.",d:"Vent venant de l'arrière du travers, entre 90° et 150°. Voiles largement choquées, gîte faible, sensation de calme trompeuse — c'est souvent là qu'on va le plus vite sans s'en rendre compte.",a:"Le calme du largue est trompeur : le vent apparent y est plus faible qu'il n'est réellement."},
 ventarriere:{ch:4,t:"Le vent arrière",n:"vent arrière",c:"Les allures",q:"Vent pile dans le dos : voiles à fond, et le risque d'empannage sauvage.",d:"Vent venant exactement de l'arrière, à 180°. Les voiles sont choquées à fond, le bateau ne gîte plus. C'est l'allure la plus tranquille en apparence et la plus piégeuse : la bôme peut traverser sans prévenir.",a:"Au vent arrière, on ne quitte pas la bôme des yeux. C'est là que se produisent les empannages sauvages."},
 louvoyer:{ch:4,t:"Louvoyer",n:"louvoyer",c:"Les manœuvres",q:"Avancer contre le vent en zigzag, puisqu'on ne peut pas y aller droit.",d:"Remonter au vent en enchaînant des bords de près à droite et à gauche du lit du vent, puisqu'on ne peut pas y aller en ligne droite. On dit aussi « tirer des bords ».",a:"Louvoyer double environ la distance parcourue. C'est le prix de la remontée au vent."},
 virement:{ch:4,t:"Le virement de bord",n:"virement de bord",c:"Les manœuvres",q:"Changer de bord en passant l'étrave dans le lit du vent.",d:"Passer d'un bord à l'autre en faisant traverser le lit du vent par l'étrave. Le bateau loffe, passe vent debout sur son élan, et repart de l'autre côté. Les voiles d'avant changent de côté, la bôme suit toute seule.",a:"Un virement se fait avec de la vitesse : sans élan, le bateau reste planté dans le lit du vent."},
 empannage:{ch:4,t:"L'empannage",n:"empannage",c:"Les manœuvres",q:"Changer de bord en passant l'arrière dans le lit du vent : la manœuvre à risque.",d:"Passer d'un bord à l'autre en faisant traverser le lit du vent par l'arrière du bateau. La bôme balaie tout le cockpit d'un coup. Contrôlé, c'est une manœuvre normale ; subi, c'est le principal danger du bord.",a:"On empanne en reprenant l'écoute de GV à fond avant, puis en la relâchant après. Jamais la bôme en roue libre."}
,
/* ======================= CHAPITRE 5 ======================= */
 erre:{ch:5,t:"L'erre",n:"erre",c:"L'approche",q:"La vitesse résiduelle du bateau une fois le moteur débrayé.",d:"La vitesse que le bateau garde quand on ne pousse plus. Onze mètres et cinq tonnes ne s'arrêtent pas net : l'erre se calcule avant d'entrer, pas pendant.",a:"On entre au port à la vitesse à laquelle on accepte de taper. Pas plus vite."},
 defense:{ch:5,t:"Le pare-battage",n:"pare-battage",c:"L'approche",q:"Le boudin qu'on suspend le long de la coque pour la protéger du quai.",d:"Le boudin gonflable suspendu le long de la coque pour la protéger du quai et des voisins. On les met en place avant d'entrer, à la bonne hauteur et du bon côté.",a:"Personne ne dit le mot en entier : à bord, c'est un parbat. « Défense » se comprend, « pare-choc » n'existe pas."},
 pendille:{ch:5,t:"La pendille",n:"pendille",c:"L'approche",q:"Le cordage relevé depuis le ponton qui mène à un corps-mort devant la place.",d:"Le cordage qui court du ponton jusqu'à un corps-mort au fond du bassin. En Méditerranée, on l'attrape en arrivant et on la tend à l'avant pour retenir le bateau loin du quai.",a:"Une pendille sort de l'eau couverte de coquillages. Des gants, ou des mains coupées."},
 briefing:{ch:5,t:"Le briefing",n:"briefing",c:"L'approche",q:"Le tour de parole où chacun reçoit son poste, avant que la manœuvre commence.",d:"Le point que le skipper fait avant d'entrer : qui tient quoi, qui va où, qui parle. Il se fait au large, au calme, une fois pour toutes — dans le port il est trop tard, on ne s'entend plus et personne n'a de main libre.",a:"Une manœuvre de port ratée est presque toujours une manœuvre non briefée."},
 noeudchaise:{ch:5,t:"Le nœud de chaise",n:"nœud de chaise",c:"Les trois nœuds",q:"La boucle fixe qui ne se serre jamais et se défait toujours, même après effort.",d:"Une boucle qui ne coulisse pas, ne se serre pas sur ce qu'elle entoure, et se dénoue même après avoir été chargée. Le nœud à connaître avant tous les autres : il fait un point d'amarrage, une sangle de secours, une boucle autour de soi.",a:"Le lapin sort du terrier, fait le tour de l'arbre, et rentre au terrier."},
 tourtaquet:{ch:5,t:"Le tour de taquet",n:"tour de taquet",c:"Les trois nœuds",q:"La façon de bloquer une amarre sur un T, en huit, largable en trois secondes.",d:"Un tour mort à la base, puis des huit croisés autour des cornes. Ce n'est pas un nœud : c'est un enroulement qui tient par friction et se largue instantanément, même sous tension.",a:"Une clé de blocage seulement s'il y a du roulis. Sinon les huit suffisent, et rien ne coince."},
 noeudcabestan:{ch:5,t:"Le nœud de cabestan",n:"nœud de cabestan",c:"Les trois nœuds",q:"Les deux boucles croisées qui accrochent un bout à un montant en une seconde.",d:"Deux boucles croisées passées sur un chandelier, un piquet ou une barre. Il se fait d'une main, tient tant que la tension est constante, et se défait aussitôt. Le nœud des parbats.",a:"Il glisse si la tension varie : parfait pour un parbat, jamais pour retenir une personne."}
};
