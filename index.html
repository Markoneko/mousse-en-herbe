/* =====================================================================
   RÉCITS
   ===================================================================== */
const M=(id,txt)=>`<button class="mot" data-id="${id}" onclick="ouvrirFiche('${id}')">${txt||G[id].n}</button>`;

const CHAP={
/* ============================== CHAPITRE 1 ============================== */
 1:{titre:"Monter à bord", badge:"Pied marin", depart:"titre", suivant:2,
  P:{
 titre:{titre:true,txt:`<h1>Monter à bord<span class="sous">Où l'on découvre qu'un bateau n'a ni devant, ni derrière, ni gauche, ni droite.</span></h1>
   <p>Tu vas embarquer sur A'Why. Une heure ici t'évitera de passer la première matinée à hocher la tête sans comprendre un mot.</p>
   <p>Les mots soulignés en magenta s'ouvrent : clique, lis, referme. Ils rentrent dans ton carnet, que tu peux rouvrir à tout moment en haut de l'écran.</p>`,suite:"depart"},
 depart:{txt:`<p>Neuf heures. Le ${M("ponton")} bouge doucement sous tes pieds, ce qui est déjà une petite surprise. Au bout, un voilier blanc de 35 pieds, un peu penché sur son ombre : A'Why.</p>
   <p>Une tête sort de l'arrière du bateau. C'est le skipper.</p>
   <p class="dit">« Salut ! Monte, pose ton sac. Par l'arrière ! »</p>
   <p>Ton sac pèse quinze kilos. Le bateau est à un mètre du ponton. « Par l'arrière » — soit.</p>`,
  choix:[{t:"Tu poses le pied sur le câble qui court le long du bateau et tu enjambes.",v:"cable"},
         {t:"Tu contournes jusqu'à la plage plate, tout au bout, au ras de l'eau.",v:"jupe"},
         {t:"Tu demandes où exactement.",v:"demande"}]},
 cable:{cons:`<span class="tag">Ce qui se passe</span>Le câble cède de dix centimètres sous ta chaussure, le petit poteau qui le tient grince, ton sac part en avant et t'emmène avec lui. Tu te rattrapes de justesse à l'arceau métallique. Le skipper n'a rien dit, mais il a fermé les yeux une seconde.`,
   txt:`<p>Ce câble s'appelle une ${M("filiere")}. Elle est là pour t'empêcher de tomber <em>de côté</em>, pas pour porter ton poids. Les montants verticaux qui la tiennent sont des ${M("chandelier","chandeliers")} : ils plient. L'arceau auquel tu viens de te raccrocher, lui, est un ${M("balcon")}, et celui-là tient bon — c'est le seul endroit du bord conçu pour ça.</p>
   <p class="dit">« Ressors et repasse par la jupe. »</p>`,suite:"jupe"},
 demande:{cons:`<span class="tag">Ce qui se passe</span>Le skipper sourit. Personne à bord ne s'est jamais moqué de quelqu'un qui demande. La curiosité est un très joli défaut.`,
   txt:`<p class="dit">« La plage plate, tout au bout, au ras de l'eau. »</p>`,suite:"jupe"},
 jupe:{txt:`<p>Cette plage plate au ras de l'eau s'appelle la ${M("jupe")}. Sur A'Why l'arrière est ouvert : c'est la porte d'entrée du bateau. Un pied dessus, une main sur le ${M("balcon","balcon arrière")} ou sur le ${M("pataras")}, et tu es à bord — sans acrobatie.</p>
   <p>Tu te retrouves dans un creux entouré de bancs, au fond duquel un long levier dépasse. C'est le ${M("cockpit")}, et le levier est la ${M("barre","barre franche")} : c'est avec ça qu'on conduit.</p>
   <p class="dit">« Pose ton sac, on le rangera en bas tout à l'heure. »</p>`,
  choix:[{t:"Tu poses le sac sur un des diabolos métalliques, bien à plat.",v:"winch"},
         {t:"Tu poses le sac au fond du cockpit, au milieu.",v:"milieu"},
         {t:"Tu poses le sac sur un banc, contre le bord.",v:"banc"}]},
 winch:{cons:`<span class="tag">Ce qui se passe</span>Le sac tient trois secondes, glisse, et déroule au passage un cordage soigneusement lové. Le skipper le remet en place sans un mot. Tu comprends que c'est loin d'être la meilleure chose à faire.`,
   txt:`<p>Ce tambour est un ${M("winch")} : le treuil qui démultiplie ta force pour tendre un cordage. Il y en a six à bord — deux sur le ${M("roof")}, deux au milieu du cockpit pour les écoutes avant, deux à l'arrière pour l'écoute de la GV. C'est l'outil le plus puissant du bateau, et rien ne se pose dessus.</p>`,suite:"babordtribord"},
 milieu:{cons:`<span class="tag">Ce qui se passe</span>Deux minutes plus tard, quelqu'un traverse le cockpit et bute dedans.`,
   txt:`<p>Le fond du ${M("cockpit")} est un couloir. Au port c'est agaçant ; à la mer, sous gîte, c'est un piège. Tout ce qui traîne finit sous un pied.</p>`,suite:"babordtribord"},
 banc:{cons:`<span class="tag">Ce qui se passe</span>Le sac reste là où tu l'as mis. Personne ne trébuche. Le skipper hoche la tête.`,
   txt:`<p>Contre le bord, le passage reste libre. C'est le premier réflexe du bord, et il tient en une phrase : <strong>ce qui traîne au milieu finira sous un pied. Ce qui traîne sur les bords finira à l'eau.</strong></p>`,suite:"babordtribord"},
 babordtribord:{txt:`<p class="dit">« Tu peux me passer le bout qui est au taquet bâbord ? »</p>
   <p>Le ${M("taquet")}, tu le vois : la pièce métallique en T où le cordage est bloqué en huit. Il y en a un de chaque côté. « Bâbord », en revanche, tu n'en as aucune idée. Tu regardes à gauche. Puis à droite. Le skipper est assis en face de toi, donc sa gauche est ta droite — ou l'inverse.</p>`,
  choix:[{t:"Tu prends celui de ta gauche à toi, assis face à l'arrière.",v:"faux"},
         {t:"Tu te tournes vers l'avant du bateau, et tu prends celui de gauche.",v:"vrai"},
         {t:"Tu prends celui de la gauche du skipper.",v:"faux"}]},
 faux:{cons:`<span class="tag">Ce qui se passe</span>Tu tends la main vers le mauvais côté. Ce n'est pas grave : au port. En manœuvre, ça l'est.`,
   txt:`<p>C'est ici que le bateau cesse de ressembler à une voiture. <button class="mot bab" data-id="babord" onclick="ouvrirFiche('babord')">Bâbord</button> et <button class="mot tri" data-id="tribord" onclick="ouvrirFiche('tribord')">tribord</button> ne sont pas ta gauche et ta droite : ce sont celles <em>du bateau</em>, face à l'avant. Elles ne bougent jamais.</p>
   <p>Et c'est toute l'astuce, celle qui vaut pour la suite : à bord, <strong>les repères n'appartiennent à personne.</strong> Ni à toi, ni au skipper.</p>`,suite:"final"},
 vrai:{cons:`<span class="tag">Ce qui se passe</span>Tu te retournes d'abord, tu choisis ensuite. C'est exactement le bon geste.`,
   txt:`<p><button class="mot bab" data-id="babord" onclick="ouvrirFiche('babord')">Bâbord</button> et <button class="mot tri" data-id="tribord" onclick="ouvrirFiche('tribord')">tribord</button> ne sont pas ta gauche et ta droite : ce sont celles <em>du bateau</em>, face à l'avant. Elles ne bougent jamais — que tu sois assis à l'envers, couché, ou penché par-dessus bord.</p>
   <p>Et c'est toute l'astuce, celle qui vaut pour la suite : à bord, <strong>les repères n'appartiennent à personne.</strong> Ni à toi, ni au skipper.</p>`,suite:"final"},
 final:{txt:`<p>Le skipper largue une ${M("amarre")} et te fait signe de descendre poser ton sac. L'escalier raide qui plonge à l'intérieur est la ${M("descente")} — on la prend en marche arrière, comme une échelle quand elle est grande, on descend de face avec précaution quand elle est courte. En bas, la pièce à vivre : le ${M("carre")}.</p>
   <p>En remontant, tu passes sous le ${M("roof")}, la partie surélevée au milieu du ${M("pont")} : c'est le plafond du carré, vu de dehors.</p>
   <p class="dit">« Bon. Tu sais monter, poser ton sac et distinguer les deux côtés. Le reste s'apprend en route. »</p>
   <p>Il ne le dira pas comme ça, mais tu viens de faire le plus dur : tu as arrêté d'appeler les choses par leur forme.</p>`,suite:"atelier"},
 atelier:{atelier:true},
 epreuve:{epreuve:true}
  },
  Q:[
   {q:"Le skipper dit : « embarque par la jupe ». Tu vas…",r:["tout à l'arrière, au ras de l'eau","tout à l'avant, sous le balcon","au milieu, en enjambant la filière"],b:0},
   {q:"Un winch sert à…",r:["attacher le bateau au ponton","démultiplier ta force pour tendre un cordage","poser les sacs pendant la manœuvre"],b:1},
   {q:"Tu es assis dans le cockpit, dos à l'avant. Bâbord est…",r:["à ta gauche à toi","à ta droite à toi","toujours le côté gauche du bateau, face à l'avant"],b:2},
   {q:"En embarquant par la jupe, la main se pose sur…",r:["la filière, qui est faite pour ça","le pataras ou le balcon arrière","le premier chandelier venu"],b:1},
   {q:"Le câble horizontal qui court le long du pont s'appelle…",r:["une amarre","une filière","un taquet"],b:1},
   {q:"Combien y a-t-il de winchs sur A'Why ?",r:["deux","quatre","six"],b:2}
  ],
  seuil:5,
  fin:"Tu sais monter à bord, poser ton sac et nommer les deux côtés. Chapitre 2 : <em>les voiles et les bouts</em> — comment ce bateau transforme du vent en vitesse."
 },

/* ============================== CHAPITRE 2 ============================== */
 2:{titre:"Les voiles et les bouts", badge:"Nomme les bouts", depart:"titre", suivant:3,
  P:{
 titre:{titre:true,txt:`<h1>Les voiles et les bouts<span class="sous">Où l'on découvre que les cordages portent le nom de ce qu'ils tiennent — et que ça change tout.</span></h1>
   <p>Hier tu savais où poser les pieds. Aujourd'hui il va falloir comprendre ce qu'on te demande, vite, et parfois dans le vent.</p>
   <p>Une seule idée dans ce chapitre. Elle est simple, et elle rend le reste évident.</p>`,suite:"phrase"},
 phrase:{txt:`<p>Le bateau sort du port. Le skipper lâche une phrase par-dessus le bruit du moteur.</p>
   <p class="dit">« Prends le bout qui tient le coin arrière du bas de la voile de devant, et tends-le avec le diabolo métallique de droite. »</p>
   <p>Tu as compris chaque mot. Tu n'as rien compris à la phrase. Le temps que tu la démontes, on est déjà passé à autre chose.</p>
   <p>Voilà pourquoi la voile a son vocabulaire. Ce n'est pas du jargon de club : c'est de la compression. La même phrase, à bord, tient en quatre mots.</p>
   <p class="dit">« Borde l'écoute de foc. »</p>`,suite:"points"},
 points:{txt:`<p>Pour comprendre ces quatre mots, il faut d'abord regarder une voile. C'est un triangle. Trois points, trois bords, six noms — pas un de plus, et ils suffisent à décrire n'importe quelle voile du monde.</p>
   <p><strong>Les trois points d'abord.</strong> Ce sont les trois coins, et c'est là qu'on attache les choses.</p>
   <div class="liste">
     <div><b>en haut</b><span>${M("pointdrisse","le point de drisse")}</span></div>
     <div><b>en bas devant</b><span>${M("pointamure","le point d'amure")}</span></div>
     <div><b>en bas derrière</b><span>${M("pointecoute","le point d'écoute")}</span></div>
   </div>
   <p>Lis-les à voix haute. Deux d'entre eux annoncent déjà un cordage — garde ça de côté, on y revient dans deux pages.</p>`,suite:"bords"},
 bords:{txt:`<p><strong>Les trois bords ensuite.</strong> Ce sont les trois côtés du triangle, du tissu tendu entre deux points. On n'y attache rien.</p>
   <div class="liste">
     <div><b>devant</b><span>${M("guindant","le guindant")} — du point de drisse au point d'amure</span></div>
     <div><b>en bas</b><span>${M("bordure","la bordure")} — du point d'amure au point d'écoute</span></div>
     <div><b>derrière</b><span>${M("chute","la chute")} — du point d'écoute au point de drisse</span></div>
   </div>
   <p>Trois points, trois bords, et rien d'autre pour l'instant. Les points servent à attacher, les bords servent à donner la forme.</p>`,suite:"deuxvoiles"},
 deuxvoiles:{txt:`<p>Car A'Why en porte deux à la fois. La ${M("grandvoile")}, à l'arrière. Le ${M("foc")}, à l'avant.</p>
   <p>Le foc n'est pas un meuble. A'Why est un bateau de régate : il embarque neuf voiles dans ses coffres, et le foc du jour se choisit selon la force du vent. Pas d'enrouleur à bord — un foc se hisse, se creuse, et se change quand le temps tourne. C'est le poids des bateaux de course, et c'est aussi leur intérêt.</p>
   <p>Deux voiles hissées, mais un seul jeu de trois noms de points et trois noms de bords. C'est là que la mécanique se met en place.</p>`,
  choix:[{t:"Deux voiles × trois points d'attache, ça doit faire six noms de points différents.",v:"six"},
         {t:"Les mêmes trois noms d'attache servent aux deux voiles, on précise laquelle.",v:"trois"},
         {t:"Chaque voile a ses propres mots, sans rapport entre elles.",v:"propres"}]},
 six:{cons:`<span class="tag">Ce qui se passe</span>Ce serait logique. Mais six noms de points à retenir au lieu de trois, pour dire deux fois la même chose — le bord a choisi plus économe.`,
   txt:`<p>Les trois points gardent leurs trois noms, sur toutes les voiles. Ce qui change, c'est la voile qu'on nomme après : <em>point d'écoute de grand-voile</em>, <em>point d'écoute de foc</em>.</p>`,suite:"regle"},
 propres:{cons:`<span class="tag">Ce qui se passe</span>Non — et heureusement. Le vocabulaire de la voile est vieux de plusieurs siècles ; il a eu le temps d'être simplifié.`,
   txt:`<p>Les trois points gardent leurs trois noms, sur toutes les voiles. Ce qui change, c'est la voile qu'on nomme après : <em>point d'écoute de grand-voile</em>, <em>point d'écoute de foc</em>.</p>`,suite:"regle"},
 trois:{cons:`<span class="tag">Ce qui se passe</span>Exactement. Trois noms de points et trois noms de bords pour toutes les voiles du bateau, et on ajoute laquelle quand il y a un doute.`,
   txt:`<p>Ce qui donne : <em>point d'écoute de grand-voile</em>, <em>point d'écoute de foc</em>. Le nom du point, puis le nom de la voile.</p>`,suite:"regle"},
 regle:{txt:`<div class="regle"><span class="tag">La règle du chapitre</span>
   <p>Un ${M("bout")} prend le nom du <strong>point de la voile</strong> auquel il est frappé, suivi du nom de la <strong>voile</strong> à laquelle il appartient.</p></div>
   <p>Voilà pourquoi deux des trois points annonçaient un cordage. Celui qui est frappé au point de drisse, et qui monte au sommet du mât pour hisser la voile, s'appelle la ${M("drisse")}. Sur la grand-voile : <em>drisse de grand-voile</em>. Sur le foc : <em>drisse de foc</em>.</p>
   <p>Celui qui est frappé au point d'écoute, et qui règle l'ouverture, s'appelle l'${M("ecoute")}. <em>Écoute de grand-voile</em>. <em>Écoute de foc</em>.</p>
   <p>Deux bouts, deux voiles, quatre noms — et pas un mot de plus à apprendre. Le nom du bout, tu le lis sur la voile.</p>`,suite:"test"},
 test:{txt:`<p>Le skipper te teste, l'air de rien.</p>
   <p class="dit">« Le bout qui part du coin haut du foc, il s'appelle comment ? »</p>`,
  choix:[{t:"L'écoute de foc.",v:"rate"},
         {t:"La drisse de foc.",v:"reussi"},
         {t:"Le guindant de foc.",v:"bord"}]},
 rate:{cons:`<span class="tag">Ce qui se passe</span>Le coin haut, c'est le point de drisse — et le point d'écoute est en bas derrière. Bon principe, mauvais point.`,
   txt:`<p>Point de drisse en haut, donc drisse. Point d'écoute en bas derrière, donc écoute. Rejoue la règle dans ce sens et elle ne rate jamais.</p>`,suite:"greement"},
 bord:{cons:`<span class="tag">Ce qui se passe</span>Le guindant est un bord de la voile, pas un point — et ce n'est pas un cordage, c'est du tissu.`,
   txt:`<p>Trois points pour les bouts, trois bords pour la forme. Les cordages se frappent aux points, jamais aux bords.</p>`,suite:"greement"},
 reussi:{cons:`<span class="tag">Ce qui se passe</span>Sans hésiter. Le skipper ne relève pas, ce qui est sa façon d'approuver.`,
   txt:`<p>Point de drisse en haut, donc drisse. Nom du point, nom de la voile. Tu n'as rien mémorisé : tu as lu la réponse sur la voile.</p>`,suite:"greement"},
 greement:{txt:`<p>Un dernier mot sur ce qui tient tout cela en l'air, et qui n'appartient ni aux points ni aux bords : le gréement.</p>
   <div class="liste">
     <div><b>vertical</b><span>${M("mat","le mât")}, tenu debout par ses câbles</span></div>
     <div><b>vers l'avant</b><span>${M("etai","l'étai")}, du haut du mât à l'étrave — le foc s'y hisse</span></div>
     <div><b>horizontale</b><span>${M("bome","la bôme")}, articulée au mât — la bordure de GV y court</span></div>
   </div>
   <p>Trois pièces rigides. Elles ne portent pas de nom de point : ce sont des supports, pas des attaches.</p>`,suite:"paresa"},
 paresa:{txt:`<p>Reste une dernière chose, et elle n'a rien à voir avec le vocabulaire. Le skipper se tourne vers l'avant.</p>
   <p class="dit">« Parés à hisser la grand-voile ? »</p>
   <p>Il attend. Il ne bouge pas. Il ne dira pas un mot de plus tant que quelqu'un n'aura pas répondu.</p>`,
  choix:[{t:"Tu hoches la tête et tu attrapes la drisse.",v:"muet"},
         {t:"Tu réponds « Parés ! » à voix haute.",v:"pares"}]},
 muet:{cons:`<span class="tag">Ce qui se passe</span>Rien ne se passe. Le skipper te regarde. À trois mètres, dans le vent, dos tourné, un hochement de tête n'existe pas.`,
   txt:`<p>À bord, la voix est le seul canal fiable. On répond, à voix haute, même quand ça paraît idiot — surtout quand ça paraît idiot.</p>`,suite:"protocole"},
 pares:{cons:`<span class="tag">Ce qui se passe</span>« Envoyez ! » Et la voile monte.`,
   txt:`<p>Une syllabe, et la manœuvre a démarré. C'est tout ce que le skipper attendait.</p>`,suite:"protocole"},
 protocole:{txt:`<p>Ces allers-retours ne sont pas de la politesse. C'est un protocole, au sens strict — le même qu'entre deux machines sur un réseau. Un message part, un accusé de réception revient, et rien ne se déclenche avant.</p>
   <div class="protocole">
     <span>Parés à ?</span> → <span class="rep">Parés</span> → <span>Envoyez</span> → <span class="rep">C'est fait</span>
   </div>
   <p>Quatre temps. La question, l'accusé, l'ordre, le compte rendu. Sans le retour, celui qui a parlé ne sait pas s'il a été entendu, et il doit choisir entre attendre pour rien ou lancer une manœuvre à l'aveugle. Les deux coûtent cher.</p>
   <p>On reverra ce protocole en détail avec les manœuvres. Pour l'instant, retiens qu'un ordre sans réponse est un ordre qui n'a pas été donné.</p>`,suite:"final"},
 final:{txt:`<p>Le foc monte à son tour le long de l'étai, mou et claquant, puis se creuse d'un coup quand l'écoute est reprise. Le moteur se tait. Le bateau s'incline un peu et se met à avancer sans bruit, ce qui est toujours une petite surprise, même quand on s'y attendait.</p>
   <p class="dit">« Tu vois, maintenant je peux te parler. »</p>
   <p>C'est exactement ça. Le vocabulaire n'était pas une barrière à franchir avant de naviguer : c'était la condition pour qu'on puisse te dire quelque chose d'utile pendant qu'on navigue.</p>`,suite:"atelier"},
 atelier:{atelier:true},
 epreuve:{epreuve:true}
  },
  Q:[
   {q:"Les trois points d'une voile sont…",r:["guindant, bordure, chute","point de drisse, point d'amure, point d'écoute","mât, bôme, étai"],b:1},
   {q:"Les trois bords d'une voile sont…",r:["guindant, bordure, chute","drisse, écoute, amure","mât, bôme, étai"],b:0},
   {q:"Le point bas et arrière d'une voile s'appelle…",r:["le point de drisse","le point d'amure","le point d'écoute"],b:2},
   {q:"Le bout frappé au point de drisse de la grand-voile s'appelle…",r:["l'écoute de grand-voile","la drisse de grand-voile","la bordure de grand-voile"],b:1},
   {q:"« Borde l'écoute de foc » veut dire : agis sur le bout frappé…",r:["au point d'écoute du foc","au point de drisse du foc","au point d'amure du foc"],b:0},
   {q:"Le point d'amure d'une voile est le point qui…",r:["voyage d'un bord à l'autre","reste fixé au bateau","se hisse en haut du mât"],b:1},
   {q:"Sur A'Why, la voile d'avant…",r:["s'enroule autour de l'étai quand on n'en veut plus","se hisse, se creuse, et se change selon le vent","reste à poste toute la saison"],b:1},
   {q:"Le skipper lance « Parés à virer ? ». La bonne conduite est de…",r:["hocher la tête et se tenir prêt","répondre à voix haute","attendre l'ordre suivant sans rien dire"],b:1},
   {q:"Pourquoi l'écoute et le point d'écoute portent-ils le même nom ?",r:["par hasard historique","parce que le bout prend le nom du point où il est frappé","parce qu'ils sont tous deux à l'arrière du bateau"],b:1}
  ],
  seuil:8,
  fin:"Tu sais lire une voile et nommer les bouts sans les apprendre par cœur. Chapitre 3 : <em>les actions</em> — trois binômes de verbes, et deux repères à ne jamais confondre."
 },

/* ============================== CHAPITRE 3 ============================== */
 3:{titre:"Les actions", badge:"Trois binômes", depart:"titre", suivant:4,
  P:{
 titre:{titre:true,txt:`<h1>Les actions<span class="sous">Où l'on découvre que six verbes suffisent — à condition de savoir en permanence d'où vient le vent.</span></h1>
   <p>Tu sais nommer les objets et les bouts. Il reste à savoir quoi en faire.</p>
   <p>Six verbes, groupés en trois binômes. Chaque binôme est un couple de contraires, et chaque couple s'applique à un objet précis : la drisse, l'écoute, la barre.</p>`,suite:"question"},
 question:{txt:`<p>Mais avant les six verbes, une question. Le skipper la pose sans prévenir, à n'importe quel moment de la journée, et il la posera encore la semaine prochaine.</p>
   <p class="dit">« D'où vient le vent ? »</p>
   <p>Ce n'est pas une colle. Le ${M("vent")} commande le cap qu'on peut tenir, le réglage des voiles, le côté où s'asseoir, et ce qui se passe si on tourne la barre.</p>`,
  choix:[{t:"Tu regardes la girouette en tête de mât.",v:"girouette"},
         {t:"Tu regardes les drapeaux du port, à un mille derrière.",v:"drapeaux"},
         {t:"Tu tournes lentement la tête jusqu'à sentir le vent également sur les deux joues.",v:"joues"}]},
 girouette:{cons:`<span class="tag">Ce qui se passe</span>Bonne réponse, et la plus rapide. Un coup d'œil en l'air, la flèche te donne le vent tel que le bateau le ressent.`,
   txt:`<p>La girouette, les penons cousus sur les voiles, les rides sur l'eau, la sensation sur la nuque : quatre sources, et l'on en croise toujours au moins deux.</p>`,suite:"deuxreperes"},
 drapeaux:{cons:`<span class="tag">Ce qui se passe</span>Ils te renseignent sur le vent qu'il faisait là-bas, tout à l'heure. À un mille de distance, ce n'est déjà plus le même.`,
   txt:`<p>Le vent se lit sur le bateau, pas au loin : girouette en tête de mât, penons des voiles, rides sur l'eau à quelques mètres, sensation sur la nuque.</p>`,suite:"deuxreperes"},
 joues:{cons:`<span class="tag">Ce qui se passe</span>Le vieux réflexe, et il marche. Quand les deux joues reçoivent autant de vent, tu es face à lui.`,
   txt:`<p>C'est le sens le plus fiable quand on n'a rien d'autre. On le complète d'un coup d'œil à la girouette en tête de mât et aux penons cousus sur les voiles.</p>`,suite:"deuxreperes"},
 deuxreperes:{txt:`<p>Attention à ne pas surinterpréter cette question. Le vent n'est pas le seul repère du bord : il en est un sur deux. L'autre, c'est le ${M("nord")}.</p>
   <div class="regle"><span class="tag">Les deux repères</span>
   <p>Le <strong>nord</strong> est fixe. Il sert à savoir <em>où l'on va</em> : le cap, la route, la carte, le port d'arrivée.</p>
   <p>Le <strong>vent</strong> bouge. Il sert à savoir <em>ce que le bateau peut faire</em> : les allures possibles, le réglage des voiles, le sens des ordres.</p></div>
   <p>Un navigateur qui ne connaît que le nord se retrouve à vouloir aller droit là où le voilier ne peut pas aller. Un équipier qui ne connaît que le vent règle très bien des voiles qui l'emmènent nulle part. Les deux repères travaillent ensemble, et aucun ne remplace l'autre.</p>
   <p>Ce chapitre parle du second, parce que c'est de lui que dépendent les six verbes.</p>`,suite:"lit"},
 lit:{txt:`<p>Une fois le vent trouvé, trace mentalement son axe. Cet axe s'appelle le ${M("litduvent")}, et c'est la seule direction interdite au voilier : dans un secteur d'environ 45° de part et d'autre, les voiles battent et le bateau s'arrête.</p>
   <p>Tout le reste du tour d'horizon est navigable. Le lit du vent découpe aussi le bateau en deux : le côté ${M("auvent","au vent")}, d'où vient le vent, celui qui se relève à la gîte et où l'équipage s'assoit ; et le côté ${M("souslevent","sous le vent")}, à l'opposé, celui qui plonge.</p>`,suite:"binome1"},
 binome1:{txt:`<p>Premier binôme. Il porte sur la <strong>drisse</strong>, et son mouvement est vertical.</p>
   <div class="binome">
     <div><b>${M("hisser")}</b><span>La voile monte. On tire sur la drisse.</span></div>
     <div class="fleche">↕</div>
     <div><b>${M("affaler")}</b><span>La voile descend. On libère la drisse, en accompagnant.</span></div>
   </div>
   <p>Le plus simple des trois : une voile monte, ou elle descend. Il dépend quand même du vent — une voile qui porte déjà ne monte plus, alors on hisse près du lit du vent.</p>`,suite:"binome2"},
 binome2:{txt:`<p>Deuxième binôme. Il porte sur l'<strong>écoute</strong>, et son mouvement est horizontal : la voile se rapproche de l'axe du bateau, ou s'en éloigne.</p>
   <div class="binome">
     <div><b>${M("border")}</b><span>On tire l'écoute. La voile se referme vers l'axe.</span></div>
     <div class="fleche">↔</div>
     <div><b>${M("choquer")}</b><span>On laisse filer l'écoute. La voile s'ouvre vers l'extérieur.</span></div>
   </div>
   <p>Trop bordée, la voile est plate et le bateau se couche sans avancer. Trop choquée, elle ${M("faseyer","faseye")} : elle bat, elle claque, elle ne tire plus. Entre les deux il y a un réglage juste, et la voile te dit lequel — le faseyement n'est pas une panne, c'est un message.</p>`,suite:"binome3"},
 binome3:{txt:`<p>Troisième binôme. Il porte sur la <strong>barre</strong>, et c'est le seul qui fasse tourner le bateau lui-même. C'est aussi le seul dont les deux mots n'ont aucun sens sans le vent.</p>
   <div class="binome">
     <div><b>${M("loffer")}</b><span>L'étrave se rapproche du lit du vent.</span></div>
     <div class="fleche">↻</div>
     <div><b>${M("abattre")}</b><span>L'étrave s'éloigne du lit du vent.</span></div>
   </div>
   <p>Relis les deux définitions. Ni gauche, ni droite, ni nord : uniquement « vers le vent » et « loin du vent ». Un même coup de barre s'appelle loffer un jour et abattre le lendemain, selon d'où souffle le vent.</p>
   <p>C'est là que la question du skipper prend tout son sens. <strong>Sans savoir où est le vent, tu ne peux pas obéir à l'ordre.</strong> Pas parce que tu es débutant : parce que l'ordre ne veut littéralement rien dire.</p>`,suite:"exercice"},
 exercice:{txt:`<p>Le bateau file. Le vent vient de l'avant tribord, la grand-voile est bien réglée.</p>
   <p class="dit">« Loffe un peu. »</p>
   <p>Tu agis sur la barre, l'étrave se rapproche du vent — et aussitôt le guindant de la grand-voile se met à trembler.</p>`,
  choix:[{t:"Tu bordes l'écoute : la voile se referme.",v:"borde"},
         {t:"Tu choques l'écoute : la voile s'ouvre et prend plus d'air.",v:"choque"},
         {t:"Tu abats pour revenir où tu étais.",v:"abat"}]},
 borde:{cons:`<span class="tag">Ce qui se passe</span>Le tremblement disparaît. Le bateau accélère.`,
   txt:`<p>Les binômes sont couplés deux à deux. En loffant, tu réduis l'angle entre le vent et le bateau ; la voile doit se refermer d'autant.</p>
   <div class="regle"><span class="tag">Le couplage</span>
   <p><strong>Qui loffe borde. Qui abat choque.</strong> Le mouvement de la barre appelle toujours celui de l'écoute, dans le même sens.</p></div>`,suite:"final"},
 choque:{cons:`<span class="tag">Ce qui se passe</span>La voile bat de plus belle, le bateau ralentit. C'est l'inverse qu'il fallait faire.`,
   txt:`<p>En loffant, l'angle entre le vent et le bateau se referme ; la voile doit se refermer aussi. Choquer l'ouvre davantage — exactement ce qu'il ne fallait pas.</p>
   <div class="regle"><span class="tag">Le couplage</span>
   <p><strong>Qui loffe borde. Qui abat choque.</strong> Le mouvement de la barre appelle toujours celui de l'écoute, dans le même sens.</p></div>`,suite:"final"},
 abat:{cons:`<span class="tag">Ce qui se passe</span>Ça marche : la voile se retend. Mais tu as annulé l'ordre au lieu de l'exécuter.`,
   txt:`<p>Abattre était une solution — la mauvaise, puisqu'on te demandait de loffer. La bonne consistait à accompagner : en loffant, l'angle se referme, donc la voile doit se refermer aussi.</p>
   <div class="regle"><span class="tag">Le couplage</span>
   <p><strong>Qui loffe borde. Qui abat choque.</strong> Le mouvement de la barre appelle toujours celui de l'écoute, dans le même sens.</p></div>`,suite:"final"},
 final:{txt:`<p>Six verbes, trois objets, un couplage. C'est tout l'outillage de base, et il tient dans une phrase : <em>on hisse ou on affale avec la drisse, on borde ou on choque avec l'écoute, on loffe ou on abat avec la barre — et les deux derniers vont ensemble.</em></p>
   <p>Le skipper te regarde en coin.</p>
   <p class="dit">« D'où vient le vent ? »</p>
   <p>Cette fois tu réponds sans lever les yeux. Puis, sans qu'on te le demande, tu ajoutes le cap. Les deux repères, ensemble : c'est le vrai signe qu'on commence à naviguer.</p>`,suite:"atelier"},
 atelier:{atelier:true},
 epreuve:{epreuve:true}
  },
  Q:[
   {q:"Loffer, c'est faire tourner le bateau pour…",r:["aller vers la droite","rapprocher l'étrave du lit du vent","éloigner l'étrave du lit du vent"],b:1},
   {q:"Border, c'est agir sur…",r:["la drisse, pour monter la voile","l'écoute, pour refermer la voile vers l'axe","la barre, pour changer de cap"],b:1},
   {q:"Une voile qui faseye est une voile qui…",r:["bat au vent et ne tire plus","est déchirée","est trop bordée"],b:0},
   {q:"Le côté au vent d'un bateau est…",r:["celui qui plonge à la gîte","celui d'où vient le vent","toujours tribord"],b:1},
   {q:"Le skipper dit « abats ». Sur l'écoute, tu dois donc…",r:["border","choquer","ne rien toucher"],b:1},
   {q:"Quelle est la différence entre le nord et le vent comme repères ?",r:["le nord est fixe et sert à la route, le vent bouge et commande la voile","le nord sert en mer, le vent sert au port","aucune : ce sont deux façons de dire la même chose"],b:0},
   {q:"Pourquoi « loffer » n'a-t-il aucun sens sans connaître le vent ?",r:["parce que le mot est ambigu en français","parce que le mouvement se définit par rapport au lit du vent","parce qu'il dépend du cap au compas"],b:1},
   {q:"Affaler une voile, c'est…",r:["la lâcher d'un coup","la faire descendre en accompagnant sa drisse","la border au maximum"],b:1},
   {q:"Le lit du vent est…",r:["l'endroit où l'on dort à bord","l'axe du vent et le secteur où le voilier ne peut pas avancer","le côté sous le vent du bateau"],b:1}
  ],
  seuil:8,
  fin:"Tu sais agir, et tu sais à partir de quoi chaque action se compte. Chapitre 4 : <em>les allures et les manœuvres</em> — le tour d'horizon complet, et comment passer d'un bord à l'autre."
 },

/* ============================== CHAPITRE 4 ============================== */
 4:{titre:"Les allures et les manœuvres", badge:"Tour d'horizon", depart:"titre", suivant:5,
  P:{
 titre:{titre:true,txt:`<h1>Les allures et les manœuvres<span class="sous">Où le tour d'horizon se découpe en tranches, et où l'on apprend à passer d'un bord à l'autre.</span></h1>
   <p>Tu sais que le lit du vent est interdit et que tout le reste est navigable. « Tout le reste », ça fait beaucoup : il est temps de le découper.</p>
   <p>Sept tranches, deux manœuvres. C'est tout le chapitre.</p>`,suite:"notion"},
 notion:{txt:`<p>Une ${M("allure")}, c'est l'angle entre l'axe du bateau et le lit du vent. Rien d'autre.</p>
   <p>Pas le cap au compas : on peut faire route au nord à toutes les allures selon d'où souffle le vent. Pas la vitesse : on va parfois plus vite au travers qu'au largue. Juste l'angle.</p>
   <p>Et puisque cet angle se prend d'un côté ou de l'autre, chaque allure existe en deux exemplaires. C'est ce que disent les ${M("amures")} : vent venant de tribord, on est <em>tribord amures</em> ; vent venant de bâbord, <em>bâbord amures</em>.</p>
   <div class="regle"><span class="tag">Un réflexe utile</span>
   <p>Tribord amures, la bôme est sortie à bâbord. Bâbord amures, elle est à tribord. <strong>La bôme est toujours sous le vent</strong> — c'est le moyen le plus rapide de savoir sur quel bord on est, de loin, sur n'importe quel bateau.</p></div>`,suite:"tour"},
 tour:{txt:`<p>Le tour d'horizon, maintenant, en partant du vent et en s'en éloignant.</p>
   <div class="liste">
     <div><b>0°</b><span>${M("ventdebout","vent debout")} — impossible, la voile bat</span></div>
     <div><b>45°</b><span>${M("pres","le près")} — voiles bordées, bateau gîté, embruns</span></div>
     <div><b>90°</b><span>${M("travers","le travers")} — voiles à mi-ouverture, rapide et stable</span></div>
     <div><b>135°</b><span>${M("largue","le largue")} — voiles largement choquées, peu de gîte</span></div>
     <div><b>180°</b><span>${M("ventarriere","le vent arrière")} — voiles à fond, bôme dangereuse</span></div>
   </div>
   <p>Entre les cinq, deux allures intermédiaires que tu entendras souvent : le <em>bon plein</em>, entre le près et le travers, et le <em>grand largue</em>, entre le largue et le vent arrière. Sept en tout, mais les cinq repères suffisent à s'orienter.</p>
   <p>Remarque le mouvement d'ensemble : <strong>plus on s'écarte du vent, plus on choque.</strong> Les voiles s'ouvrent au fur et à mesure qu'on abat. C'est le couplage du chapitre précédent, appliqué à tout le tour d'horizon.</p>`,suite:"pourquoi"},
 pourquoi:{txt:`<p>Une conséquence de tout ça, et elle est brutale.</p>
   <p>Le port est droit dans le vent. Tu voudrais y aller tout droit.</p>`,
  choix:[{t:"On y va tout droit, en serrant le près au maximum.",v:"droit"},
         {t:"On y va en zigzag, par bords successifs.",v:"zigzag"},
         {t:"On allume le moteur, c'est le seul moyen.",v:"moteur"}]},
 droit:{cons:`<span class="tag">Ce qui se passe</span>Le près monte à 45° du vent, pas à 0°. Droit dans le vent, le bateau s'arrête — quelle que soit ta bonne volonté.`,
   txt:`<p>Il n'y a qu'une solution : ${M("louvoyer")}. On tire un bord de près à droite du lit du vent, puis un bord à gauche, et de zigzag en zigzag on remonte. La distance double à peu près. C'est le prix de la remontée au vent, et il se paie depuis toujours.</p>`,suite:"virement"},
 moteur:{cons:`<span class="tag">Ce qui se passe</span>C'est la solution moderne, et parfois la bonne. Mais un voilier sait remonter au vent depuis bien avant le moteur.`,
   txt:`<p>La solution à la voile s'appelle ${M("louvoyer")} : on tire un bord de près à droite du lit du vent, puis un bord à gauche, et de zigzag en zigzag on remonte. La distance double à peu près. C'est le prix de la remontée au vent.</p>`,suite:"virement"},
 zigzag:{cons:`<span class="tag">Ce qui se passe</span>Exactement. Et ce zigzag a un nom.`,
   txt:`<p>Cela s'appelle ${M("louvoyer")}, ou tirer des bords. On enchaîne un bord de près à droite du lit du vent, puis un bord à gauche, et de zigzag en zigzag on remonte. La distance double à peu près. C'est le prix de la remontée au vent.</p>`,suite:"virement"},
 virement:{txt:`<p>Chaque fois qu'on change de côté du lit du vent, on change d'amures. Cela se fait de deux façons, et une seule est confortable.</p>
   <p>La première, c'est le ${M("virement","virement de bord")} : l'étrave traverse le lit du vent. Le bateau loffe, les voiles faseyent une seconde, il passe sur son élan et repart de l'autre côté. La bôme change de bord toute seule, doucement, en passant par le milieu.</p>
   <div class="protocole">
     <span>Parés à virer ?</span> → <span class="rep">Parés</span> → <span>Envoyez</span> → <span class="rep">Bordé</span>
   </div>
   <p>Le protocole du chapitre 2, en situation réelle. Ici il n'est plus une politesse : le bateau perd de la vitesse pendant la traversée du lit du vent, et un équipier en retard sur son écoute, c'est un virement raté.</p>`,suite:"empannage"},
 empannage:{txt:`<p>La seconde façon, c'est l'${M("empannage")} : c'est l'arrière du bateau qui traverse le lit du vent. On abat au lieu de loffer, on continue à choquer, et à un moment le vent prend la grand-voile de l'autre côté.</p>
   <p>La bôme balaie alors tout le cockpit, d'un bord à l'autre, à hauteur de tête. Contrôlé, c'est une manœuvre normale qu'on fait plusieurs fois par sortie. Subi, c'est le principal accident du bord.</p>`,
  choix:[{t:"On laisse la bôme passer librement, c'est plus doux.",v:"libre"},
         {t:"On borde l'écoute de GV à fond avant, puis on la relâche après.",v:"borde2"},
         {t:"On bloque l'écoute pour empêcher la bôme de bouger.",v:"bloque"}]},
 libre:{cons:`<span class="tag">Ce qui se passe</span>La bôme part en roue libre sur toute sa course et arrive en bout d'écoute à pleine vitesse. Le bruit s'entend d'un mille. Le gréement encaisse mal, les têtes encore moins.`,
   txt:`<p>On borde l'écoute de grand-voile à fond <em>avant</em> de passer : la bôme n'a alors que quelques centimètres à parcourir. Une fois de l'autre côté, on la relâche progressivement.</p>
   <p>Et l'ordre qui compte plus que tous les autres : <strong>« Attention à la bôme »</strong>, lancé fort, avant. On s'accroupit d'abord, on regarde ensuite.</p>`,suite:"final"},
 bloque:{cons:`<span class="tag">Ce qui se passe</span>La bôme est bloquée, le vent passe quand même de l'autre côté, et le bateau se couche brutalement au lieu de tourner.`,
   txt:`<p>On borde l'écoute de grand-voile à fond avant de passer — border n'est pas bloquer. La bôme reste libre de traverser, mais elle n'a que quelques centimètres à parcourir. Une fois de l'autre côté, on relâche progressivement.</p>
   <p>Et l'ordre qui compte plus que tous les autres : <strong>« Attention à la bôme »</strong>, lancé fort, avant. On s'accroupit d'abord, on regarde ensuite.</p>`,suite:"final"},
 borde2:{cons:`<span class="tag">Ce qui se passe</span>La bôme traverse sur quelques centimètres au lieu de trois mètres. Un claquement sec, et c'est passé.`,
   txt:`<p>C'est toute la technique : raccourcir la course avant, la rendre ensuite. Le vent fait le même travail, mais il ne peut plus lancer la bôme.</p>
   <p>Et l'ordre qui compte plus que tous les autres : <strong>« Attention à la bôme »</strong>, lancé fort, avant. On s'accroupit d'abord, on regarde ensuite.</p>`,suite:"final"},
 final:{txt:`<p>Deux manœuvres, deux façons de changer d'amures. Le virement passe par l'avant : lent, sûr, coûteux en vitesse. L'empannage passe par l'arrière : rapide, économe, et dangereux si on l'improvise.</p>
   <p>Le reste de la journée s'écoule en tranches d'horizon. Un bord de près jusqu'à la pointe, un virement, un long travers, un empannage propre avant le cap, et le largue qui ramène tout le monde vers la côte.</p>
   <p>Personne n'a annoncé les allures à voix haute. Elles se sont enchaînées, et tu les as reconnues au passage. C'est comme ça qu'on sait qu'un vocabulaire est entré.</p>`,suite:"atelier"},
 atelier:{atelier:true},
 epreuve:{epreuve:true}
  },
  Q:[
   {q:"Une allure, c'est…",r:["la vitesse du bateau","l'angle entre l'axe du bateau et le lit du vent","le cap au compas"],b:1},
   {q:"Vent à 90° de l'axe du bateau, on est…",r:["au près","au travers","au vent arrière"],b:1},
   {q:"Le vent vient de tribord. On est donc…",r:["bâbord amures","tribord amures","vent debout"],b:1},
   {q:"Plus on abat, plus…",r:["on borde les voiles","on choque les voiles","on remonte au vent"],b:1},
   {q:"Louvoyer, c'est…",r:["remonter au vent en zigzag par bords successifs","naviguer au vent arrière","affaler les voiles"],b:0},
   {q:"Dans un virement de bord, c'est…",r:["l'étrave qui traverse le lit du vent","l'arrière qui traverse le lit du vent","le bateau qui s'arrête"],b:0},
   {q:"Avant d'empanner, sur l'écoute de grand-voile, on…",r:["la borde à fond, puis on la relâche après","la choque à fond pour laisser passer la bôme","ne touche à rien"],b:0},
   {q:"L'allure la plus piégeuse, où la bôme peut traverser sans prévenir, est…",r:["le près","le travers","le vent arrière"],b:2},
   {q:"En regardant un voilier de loin, la bôme sortie à bâbord indique…",r:["qu'il est tribord amures","qu'il est bâbord amures","qu'il est vent debout"],b:0}
  ],
  seuil:8,
  fin:"Tu sais lire une allure et anticiper un changement de bord. Chapitre 5 : <em>le retour au port</em> — l'endroit où l'on casse le plus de bateaux, et les trois nœuds qui servent tous les jours."
 },

/* ============================== CHAPITRE 5 ============================== */
 5:{titre:"Le retour au port", badge:"Rentrer propre", depart:"titre", suivant:null,
  P:{
 titre:{titre:true,txt:`<h1>Le retour au port<span class="sous">Où l'on découvre que les trois cents derniers mètres sont les plus délicats de la journée.</span></h1>
   <p>La mer est grande. Le port ne l'est pas.</p>
   <p>C'est là que les bateaux s'abîment, presque jamais au large. Trois cents mètres, cinq minutes, et une attention d'un tout autre ordre que celle du reste de la journée.</p>`,suite:"pourquoi"},
 pourquoi:{txt:`<p>Trois choses changent d'un coup en franchissant la digue.</p>
   <div class="liste">
     <div><b>l'espace</b><span>quelques mètres de marge, des voisins immobiles et coûteux</span></div>
     <div><b>le vent</b><span>coupé par les bâtiments, il tourne et rafale sans prévenir</span></div>
     <div><b>l'${M("erre","erre")}</b><span>cinq tonnes qui ne s'arrêtent pas quand on débraye</span></div>
   </div>
   <p>Aucune des trois ne se règle sur le moment. Toutes se règlent avant.</p>`,suite:"briefing"},
 briefing:{txt:`<p>D'où le ${M("briefing")}, fait au large, moteur au ralenti, tout le monde tourné vers le skipper.</p>
   <p>Qui tient quoi. Qui va où. Qui parle. Et surtout : ce qu'on fait si ça ne se passe pas comme prévu — parce qu'une entrée au port se rate une fois sur cinq, et qu'une entrée ratée proprement ne coûte rien du tout.</p>
   <div class="regle"><span class="tag">La règle du chapitre</span>
   <p><strong>Dans le port, on n'improvise pas ; on exécute.</strong> Toute la réflexion a eu lieu dehors, au calme, quand on pouvait encore s'entendre parler.</p></div>
   <p>Pendant le briefing, on sort aussi les ${M("defense","parbats")} et on prépare les amarres — lovées, prêtes à filer, du bon côté.</p>`,suite:"place"},
 place:{txt:`<p>Sur A'Why, en Méditerranée, la place se prend en marche arrière. On recule vers le quai, on attrape la ${M("pendille")} sur l'avant, et on l'étarque pour retenir le bateau loin du béton pendant que les amarres arrière se frappent.</p>
   <p>Le bateau approche. Un équipier saute sur le ponton avec une amarre. Enfin — il s'apprête à sauter.</p>`,
  choix:[{t:"Il saute dès que le ponton est à portée, pour ne pas rater.",v:"saute"},
         {t:"Il attend que le bateau soit arrêté et enjambe.",v:"enjambe"},
         {t:"Il se place entre le bateau et le ponton pour amortir.",v:"amortit"}]},
 saute:{cons:`<span class="tag">Ce qui se passe</span>Il atterrit un pied sur le bord, l'amarre dans une main, et se rattrape de justesse. Cette fois ça passe. Une fois sur dix, ça ne passe pas.`,
   txt:`<p>On ne saute jamais. On enjambe, une fois l'erre cassée, avec les deux mains disponibles. Personne à bord n'a jamais gagné une manœuvre en sautant — mais plusieurs y ont perdu une cheville.</p>`,suite:"securite"},
 amortit:{cons:`<span class="tag">Ce qui se passe</span>Cinq tonnes contre une jambe. Le calcul est vite fait, et c'est l'accident le plus fréquent des ports de plaisance.`,
   txt:`<p><strong>Jamais un corps entre le bateau et le quai.</strong> Jamais une main non plus, ni entre deux coques, ni entre l'amarre et le taquet. Le bateau, lui, a des parbats ; c'est leur métier.</p>`,suite:"securite"},
 enjambe:{cons:`<span class="tag">Ce qui se passe</span>Le bateau s'immobilise, l'équipier passe tranquillement, amarre en main. Personne n'a retenu son souffle.`,
   txt:`<p>C'est la bonne façon, et elle suppose la précédente : casser l'erre avant. Un bateau qu'on doit rattraper à la force des bras est un bateau qui arrivait trop vite.</p>`,suite:"securite"},
 securite:{txt:`<p>Trois interdits, et ils ne souffrent pas d'exception.</p>
   <div class="liste">
     <div><b>jamais</b><span>un corps ou une main entre le bateau et le quai, ou entre deux coques</span></div>
     <div><b>jamais</b><span>retenir un bateau qui bouge à la force des bras — on le laisse toucher</span></div>
     <div><b>jamais</b><span>un pied dans une boucle de cordage posée sur le pont</span></div>
   </div>
   <p>Le troisième surprend, et c'est le plus vicieux : une amarre qui part sous tension emmène ce qu'elle attrape. On garde les bouts lovés, pas en tas.</p>`,suite:"noeuds"},
 noeuds:{txt:`<p>Reste ce qui se passe une fois le bateau à quai : attacher. Il existe des centaines de nœuds marins. Trois suffisent pour toute une saison, et ils s'apprennent à terre, tranquillement, sur un bout de cordage.</p>
   <div class="liste">
     <div><b>une boucle</b><span>${M("noeudchaise","le nœud de chaise")} — ne se serre jamais, se défait toujours</span></div>
     <div><b>un T</b><span>${M("tourtaquet","le tour de taquet")} — pour frapper une amarre</span></div>
     <div><b>un montant</b><span>${M("noeudcabestan","le nœud de cabestan")} — pour accrocher un parbat</span></div>
   </div>
   <p>Un par situation, et pas de recouvrement : une boucle au bout d'un bout, un cordage sur un taquet, un cordage sur un barreau. Ouvre les trois fiches, puis fais-les vingt fois chacun. C'est le seul geste de ce parcours qui ne s'apprend pas en lisant.</p>`,suite:"test"},
 test:{txt:`<p>Le skipper te tend un bout et désigne le chandelier du milieu.</p>
   <p class="dit">« Accroche-moi le parbat là-dessus. »</p>`,
  choix:[{t:"Un nœud de chaise autour du chandelier.",v:"chaise"},
         {t:"Un nœud de cabestan.",v:"cabestan"},
         {t:"Trois nœuds simples serrés à fond.",v:"simple"}]},
 chaise:{cons:`<span class="tag">Ce qui se passe</span>Ça tient. Mais la boucle coulisse le long du chandelier et le parbat finit par ne plus être en face de ce qu'il protège.`,
   txt:`<p>Le chaise fait une boucle <em>fixe</em>, il ne serre pas ce qu'il entoure — c'est justement sa qualité, et ici son défaut. Sur un montant, on veut un nœud qui pince : le cabestan.</p>`,suite:"final"},
 simple:{cons:`<span class="tag">Ce qui se passe</span>Ça tient très bien. Trop bien : ce soir, sous la pluie, avec les doigts froids, tu y passeras dix minutes et tu finiras au couteau.`,
   txt:`<p>Un nœud marin se juge autant à la façon dont il se défait qu'à celle dont il tient. Sur un montant, le cabestan se fait d'une main et se dénoue d'un geste.</p>`,suite:"final"},
 cabestan:{cons:`<span class="tag">Ce qui se passe</span>Deux boucles croisées, le parbat est pendu, et tu peux le remonter de dix centimètres sans tout refaire.`,
   txt:`<p>Le bon outil pour la bonne situation. Le cabestan pince tant que la tension est constante — parfait pour un parbat, à ne jamais utiliser pour retenir une personne.</p>`,suite:"final"},
 final:{txt:`<p>Les amarres sont frappées, les parbats en place, la pendille étarquée. Le moteur se tait. Le bateau repose exactement où il était ce matin, et personne ne s'est fait mal.</p>
   <p class="dit">« Bon. Un café ? »</p>
   <p>Cinq chapitres plus tôt, tu ne savais pas par où monter. Rien de ce que tu as appris ici ne fera de toi un marin — ça, c'est la mer qui s'en charge, et il lui faut du temps. Mais tu peux désormais suivre ce qui se dit, faire ce qu'on te demande, et poser des questions utiles.</p>
   <p>C'était tout l'objet du voyage. À bord, maintenant.</p>`,suite:"atelier"},
 atelier:{atelier:true},
 epreuve:{epreuve:true}
  },
  Q:[
   {q:"L'erre d'un bateau, c'est…",r:["sa vitesse résiduelle une fois le moteur débrayé","son erreur de cap","la zone de manœuvre du port"],b:0},
   {q:"Le briefing d'entrée au port se fait…",r:["au large, avant d'entrer","à l'approche du ponton","une fois amarré"],b:0},
   {q:"Un équipier doit rejoindre le ponton. Il…",r:["saute dès qu'il peut","attend l'arrêt et enjambe","se glisse entre le bateau et le quai"],b:1},
   {q:"Le nœud qui fait une boucle qui ne se serre jamais est…",r:["le nœud de chaise","le nœud de cabestan","le tour de taquet"],b:0},
   {q:"Pour accrocher un parbat à un chandelier, on utilise…",r:["un nœud de chaise","un nœud de cabestan","un nœud simple"],b:1},
   {q:"Une amarre se frappe sur un taquet…",r:["par un nœud bien serré","par un tour mort puis des huit croisés","en la coinçant sous la base"],b:1},
   {q:"Un bateau arrive un peu trop vite sur le ponton. On…",r:["le retient à la force des bras","le laisse toucher les parbats","saute pour l'attraper"],b:1},
   {q:"Pourquoi les bouts restent-ils lovés sur le pont ?",r:["par souci d'esthétique","parce qu'une amarre qui part sous tension emmène ce qu'elle attrape","pour gagner de la place"],b:1}
  ],
  seuil:7,
  fin:"Tu sais rentrer sans casse et frapper tes trois nœuds. Le parcours est terminé — la suite se passe à bord, et elle commence par la question habituelle : d'où vient le vent ?"
 }
};

/* =====================================================================
   MOTEUR
   ===================================================================== */
const deck=document.getElementById("deck");
let chapCourant=null,pages=[],idx=0;
const acquis=new Set(),badgesObtenus=new Set();

function apprendre(id){
 acquis.add(id);document.getElementById("j-mots").textContent=acquis.size;
 document.querySelectorAll('.mot[data-id="'+id+'"]').forEach(m=>m.classList.add("vu"));
}
function ouvrirFiche(id){
 const g=G[id];
 document.getElementById("f-cat").textContent=g.c;
 document.getElementById("f-titre").textContent=g.t;
 document.getElementById("f-def").textContent=g.d;
 document.getElementById("f-astuce").textContent=g.a;
 document.getElementById("fiche").classList.add("on");
 document.getElementById("voile-fond").classList.add("on");
 apprendre(id);
}
function fermerFiche(){document.getElementById("fiche").classList.remove("on");document.getElementById("voile-fond").classList.remove("on")}
document.getElementById("fermer").onclick=fermerFiche;
document.getElementById("voile-fond").onclick=fermerFiche;

/* --- carnet --- */
const carnetVue=document.getElementById("carnet-vue");
function ouvrirCarnet(){
 let h="";
 Object.keys(TERMES).forEach(num=>{
  h+=`<div class="carnet-groupe">Chapitre ${num} — ${CHAP[num].titre}</div>`;
  let groupe="";
  TERMES[num].forEach(id=>{
   if(G[id].c!==groupe){groupe=G[id].c;h+=`<div class="carnet-groupe" style="opacity:.7">${groupe}</div>`}
   const vu=acquis.has(id);
   h+=`<div class="carnet-item${vu?"":" pas-vu"}" data-id="${id}"><b>${G[id].t}</b>${vu?"":"<em>pas encore rencontré</em>"}</div>`;
  });
 });
 document.getElementById("carnet-corps").innerHTML=h;
 document.getElementById("carnet-note").textContent=`${acquis.size} / ${Object.keys(G).length} termes`;
 document.querySelectorAll(".carnet-item").forEach(el=>el.onclick=()=>ouvrirFiche(el.dataset.id));
 carnetVue.classList.add("on");
}
document.getElementById("btn-carnet").onclick=ouvrirCarnet;
document.getElementById("carnet-fermer").onclick=()=>carnetVue.classList.remove("on");
document.addEventListener("keydown",e=>{if(e.key==="Escape"){fermerFiche();carnetVue.classList.remove("on")}});

/* --- chapitres --- */
function ouvrirChapitre(num){
 num=String(num);chapCourant=num;
 deck.innerHTML="";pages=[];idx=0;
 document.getElementById("menu-chap").value=num;
 rendre(CHAP[num].depart);
}
document.getElementById("menu-chap").onchange=e=>ouvrirChapitre(e.target.value);

function rendre(id){
 const c=CHAP[chapCourant],p=c.P[id],el=document.createElement("div");el.className="page";
 let h="";
 if(!p.titre&&!p.atelier&&!p.epreuve) h+=`<div class="folio">Chapitre ${chapCourant} — ${c.titre}</div>`;
 if(p.cons) h+=`<div class="consequence">${p.cons}</div>`;
 h+=p.txt||"";
 if(p.choix){h+='<div class="choix">';p.choix.forEach((ch,i)=>h+=`<button data-lettre="${"ABC"[i]}" data-v="${ch.v}">${ch.t}</button>`);h+='</div>'}
 el.innerHTML=h;
 if(p.choix) el.querySelectorAll(".choix button").forEach(b=>b.onclick=()=>{
  el.querySelectorAll(".choix button").forEach(x=>x.disabled=true);
  b.classList.add("choisi");rendre(b.dataset.v);
 });
 if(p.atelier) el.appendChild(corpsAtelier());
 if(p.epreuve) el.appendChild(corpsEpreuve());
 deck.appendChild(el);pages.push({id,el});
 aller(pages.length-1,false);
}
function aller(n,retour){
 if(n<0||n>=pages.length)return;
 pages.forEach(p=>p.el.classList.remove("actif","retour"));
 const pg=pages[n];if(retour)pg.el.classList.add("retour");
 pg.el.classList.add("actif");idx=n;
 window.scrollTo({top:0,behavior:"smooth"});majNav();
}
function majNav(){
 const p=CHAP[chapCourant].P[pages[idx].id],dernier=(idx===pages.length-1);
 document.getElementById("prec").disabled=(idx===0);
 document.getElementById("suiv").disabled=dernier&&(!p.suite||!!p.choix);
 document.getElementById("compte").textContent=`page ${idx+1} / ${pages.length}`;
}
document.getElementById("prec").onclick=()=>aller(idx-1,true);
document.getElementById("suiv").onclick=()=>{
 if(idx<pages.length-1){aller(idx+1,false);return}
 const p=CHAP[chapCourant].P[pages[idx].id];if(p.suite)rendre(p.suite);
};

/* --- atelier : indice → mot, groupe par groupe --- */
function melange(a){return a.slice().sort(()=>Math.random()-.5)}
let file=[],reussis=0,rates=0;
function corpsAtelier(){
 const c=CHAP[chapCourant],liste=TERMES[chapCourant];
 const d=document.createElement("div");
 d.innerHTML=`<div class="folio">Atelier — déverrouillé</div>
  <h1 style="font-size:30px">Retrouve les mots</h1>
  <p>${liste.length} indices, dans l'ordre des groupes du chapitre. On te donne la description, tu retrouves le mot. Deux erreurs et on te montre.</p>
  <div id="atelier-corps"></div>
  <div style="margin-top:14px"><button class="act" id="btn-atelier">Commencer l'atelier</button></div>
  <p class="jauge-atelier" id="score-atelier"></p>`;
 setTimeout(()=>{document.getElementById("btn-atelier").onclick=()=>{
  const groupes=[];liste.forEach(id=>{if(groupes.indexOf(G[id].c)<0)groupes.push(G[id].c)});
  file=[];groupes.forEach(g=>{melange(liste.filter(id=>G[id].c===g)).forEach(id=>file.push(id))});
  reussis=0;rates=0;
  document.getElementById("btn-atelier").style.display="none";
  prochain();
 }},0);
 return d;
}
function prochain(){
 const liste=TERMES[chapCourant],corps=document.getElementById("atelier-corps");
 if(!file.length){
  corps.innerHTML=`<div class="indice"><p><strong>Atelier terminé.</strong></p></div>`;
  document.getElementById("score-atelier").textContent=`${reussis} trouvés du premier coup sur ${liste.length}.`;
  if(!pages.some(p=>p.id==="epreuve")) rendre("epreuve");
  return;
 }
 const cible=file[0];rates=0;
 const autres=melange(liste.filter(id=>id!==cible&&G[id].c===G[cible].c))
   .concat(melange(liste.filter(id=>id!==cible&&G[id].c!==G[cible].c)));
 const props=melange([cible,autres[0],autres[1],autres[2]].filter(Boolean));
 corps.innerHTML=`<div class="indice"><span class="groupe">${G[cible].c} · ${liste.length-file.length+1}/${liste.length}</span>
   <p>${G[cible].q}</p></div>
   <div class="props">${props.map(id=>`<button data-id="${id}">${G[id].t}</button>`).join("")}</div>`;
 corps.querySelectorAll(".props button").forEach(b=>b.onclick=()=>repondre(b,cible));
 document.getElementById("score-atelier").textContent="";
}
function repondre(btn,cible){
 const corps=document.getElementById("atelier-corps");
 if(btn.dataset.id===cible){
  btn.classList.add("juste");
  corps.querySelectorAll(".props button").forEach(b=>b.disabled=true);
  if(rates===0)reussis++;
  apprendre(cible);
  setTimeout(()=>{file.shift();prochain()},650);
 }else{
  btn.classList.add("faux");btn.disabled=true;rates++;
  if(rates>=2){
   const bon=corps.querySelector('.props button[data-id="'+cible+'"]');
   bon.classList.add("juste");
   corps.querySelectorAll(".props button").forEach(b=>b.disabled=true);
   apprendre(cible);
   setTimeout(()=>{file.shift();prochain()},1100);
  }
 }
}

/* --- épreuve --- */
function corpsEpreuve(){
 const c=CHAP[chapCourant],d=document.createElement("div");
 let h=`<div class="folio">Épreuve — déverrouillée</div><h1 style="font-size:30px">${c.Q.length} questions</h1>
  <p>${c.seuil} bonnes réponses sur ${c.Q.length} et tu as ton badge.</p>`;
 c.Q.forEach((q,i)=>{h+=`<div class="qcm"><p>${i+1}. ${q.q}</p>`;
  q.r.forEach((r,j)=>h+=`<label><input type="radio" name="q${i}" value="${j}">${r}</label>`);h+=`</div>`});
 h+=`<div><button class="act" id="btn-epreuve">Valider l'épreuve</button></div><div id="verdict"></div>`;
 d.innerHTML=h;
 setTimeout(()=>{document.getElementById("btn-epreuve").onclick=corriger},0);
 return d;
}
function corriger(){
 const c=CHAP[chapCourant];let n=0,manque=[];
 c.Q.forEach((q,i)=>{const r=document.querySelector(`input[name="q${i}"]:checked`);
  if(r&&+r.value===q.b)n++;else manque.push(i+1)});
 const v=document.getElementById("verdict");
 if(n>=c.seuil){
  const suiv=c.suivant;
  v.innerHTML=`<div class="badge"><div class="sceau">${c.badge}</div>
   <p style="font-family:var(--mono);font-size:13px">${n} / ${c.Q.length} — badge ${chapCourant} sur 5</p>
   <p>${c.fin}</p>
   ${suiv?`<div style="margin-top:18px"><button class="act" id="btn-suivant">Chapitre ${suiv} →</button></div>`
         :`<div style="margin-top:18px"><button class="act" id="btn-recap">Ouvrir le carnet complet</button></div>`}
   </div>`;
  badgesObtenus.add(chapCourant);
  document.getElementById("j-badges").textContent=badgesObtenus.size;
  document.getElementById("btn-epreuve").style.display="none";
  if(suiv){document.getElementById("btn-suivant").onclick=()=>ouvrirChapitre(suiv)}
  else{document.getElementById("btn-recap").onclick=ouvrirCarnet}
 }else{
  v.innerHTML=`<p style="font-family:var(--mono);font-size:14px;color:var(--magenta)">${n} / ${c.Q.length} — il en faut ${c.seuil}. À revoir : question ${manque.join(", ")}. Rouvre le carnet, relis les fiches, retente.</p>`;
 }
}

document.getElementById("j-total").textContent=Object.keys(G).length;
ouvrirChapitre(1);
</script>

<script>
/* ============ PWA : installation et fonctionnement hors ligne ============ */
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js").catch(e=>console.log("SW non enregistré :",e));
 });
}
let invite=null;
const btnInstaller=document.getElementById("btn-installer");
window.addEventListener("beforeinstallprompt",e=>{
 e.preventDefault();invite=e;btnInstaller.hidden=false;
});
btnInstaller.onclick=async()=>{
 if(!invite)return;
 btnInstaller.hidden=true;
 invite.prompt();
 await invite.userChoice;
 invite=null;
};
window.addEventListener("appinstalled",()=>{btnInstaller.hidden=true;invite=null});
</script>
